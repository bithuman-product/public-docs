  /v1/agent/{code}/models:
    post:
      operationId: addAgentModel
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/agent/A91XMB7113/models \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"model": "expression-2"}'
            # → {"success": true, "status": "processing", ...} — poll
            #   GET /v1/agent/status/A91XMB7113 until supported_models lists it
      summary: Add a model to an existing agent
      description: |
        Add an avatar model to an agent you already created — no need to
        re-create the agent or regenerate its persona/voice/image. The agent
        must be in the `ready` state (else `409 AGENT_NOT_READY`).

        | model | what happens | prerequisites | credits | time |
        |---|---|---|---|---|
        | `expression-1` | **instant enablement** — the v1 engine drives the agent's existing image + voice at runtime; nothing is trained | stored image + voice | **0** | immediate (this response) |
        | `expression-2` | trains the per-identity Expression 2 model from the stored image | stored image | 2000 | the same training an `expression-2` creation runs — about 2–2.5 h (see [creation times](#operation/generateAgent)) |
        | `essence-2` | trains Essence 2 from the agent's stored identity video (generated internally at creation) | stored identity video (else `422`) + photorealistic-human subject (else `422 MODEL_SUBJECT_MISMATCH`) | 500 | the same training an `essence-2` creation runs — about 2–2.5 h (see [creation times](#operation/generateAgent)) |
        | `essence-1` | builds the v1 `.imx` from the agent's stored identity video (or generates one internally from the stored image) | stored identity video or image | 250 | ~10–20 min |

        Asynchronous adds return `status: "processing"` — poll
        [`GET /v1/agent/status/{agent_id}`](#tag/Agent-Generation/operation/getAgentStatus)
        until `supported_models` contains the new family. Charges are refunded
        automatically if the add fails; re-POSTing the same model never
        double-charges, and returns `status: "ready"` with `credits: 0` once
        the model already exists.
      tags: [Agent Management]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model:
                  type: string
                  enum: [essence-1, essence-2, expression-1, expression-2]
                  description: >-
                    The model to add. The Essence 2 tiers are not individually
                    addable — `essence-2` is the one combined add (Light train
                    + Quality from the same identity video). Anything else
                    returns `400 VALIDATION_ERROR` listing these options.
                  example: "expression-2"
      responses:
        "200":
          description: >-
            Model added (`status: "ready"` — instant/already available) or the
            add started (`status: "processing"` — poll supported_models).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  agent_id:
                    type: string
                  model:
                    type: string
                  status:
                    type: string
                    enum: [ready, processing]
                  credits:
                    type: integer
                    description: Credits charged for this add (0 for instant enablement / already available).
                  supported_models:
                    type: array
                    items:
                      type: string
                    description: The agent's launchable model families at response time.
                  message:
                    type: string
        "400":
          description: Invalid `model` (the message lists the addable options).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `AGENT_NOT_READY` — the agent is still generating or failed;
            models can only be added to a ready agent.
        "422":
          description: >-
            `MODEL_PREREQUISITE_MISSING` — the agent lacks a stored asset the
            model needs (e.g. `essence-2` needs the agent's stored identity
            video — generated internally by Essence creations, never
            uploaded), or
            `MODEL_SUBJECT_MISMATCH` — the Essence 2 family requires a
            photorealistic human subject and the stored image is a
            cartoon/animal/creature/robot (use `expression-2`).
        "503":
          description: >-
            `MODEL_NOT_YET_AVAILABLE` — adding a second-generation model
            (`essence-2`, `expression-2`) can't be dispatched right now.
            Both models have been generally available since the July 10, 2026
            launch, so this is a rare, temporary operational pause. Rejected
            before any charge — retry shortly. Adding the v1
            models always works.

  /v1/agent/{code}/model/download:
    get:
      operationId: downloadAgentModel
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            # 302 redirect to the artifact — -L follows it, -o names the file
            curl -L -o "A17ZTB0222.imx" \
              "https://api.bithuman.ai/v1/agent/A17ZTB0222/model/download?model=expression-2" \
              -H "api-secret: $BITHUMAN_API_SECRET"
            # → A17ZTB0222.imx  (add ?redirect=false for the URL as JSON)
      summary: Download an agent's model artifact
      description: |
        Download the generated model file for an agent you own. The family
        defaults to the agent's own model; override with `?model=<family>`
        (canonical names, legacy names, and runtime tier slugs all fold onto
        their family). Artifact per family:

        | family | artifact |
        |---|---|
        | `essence-1` | `<code>.imx` (the portable IMX container) |
        | `essence-2` | `<CODE>.imx` — the standard Essence 2 artifact (unified IMX container; size is per identity — read `Content-Length` rather than assuming a figure; **licensed weights** — renders locally in the CLI, the Python SDK, the Android library and the Swift `Essence2` product, and the first local play checks the licence with the cloud, so it needs a sign-in: https://docs.bithuman.ai/sdk/cli#what-renders-locally-and-where). `essence-2-light` is a retired internal alias for this family. |
        | `expression-2` | `<code>.avatar` — the frozen back-compat alias of `.imx`, not a distinct encoding: 96 of the 110 published objects are the current bitHuman container and 14 are still the pre-2026-07-12 CoreML zip (measured 2026-09-01; `bithuman info` reports which), ~20–90 MB per identity — runs locally on macOS (Apple Silicon) and Linux x86_64, or in the browser, and is also served on bitHuman's cloud |
        | `expression-1` | normally not downloadable (the shared v1 engine renders server-side from the agent's image) → `400 MODEL_NOT_DOWNLOADABLE`; an agent that went through the lip step owns a baked `<code>.imx` and is redirected to it like `essence-1` |

        The default response is a **302 redirect** to the artifact — the
        public URL for `essence-1`, a **1-hour signed URL** on a private
        bucket for the other families — so `curl -L` and browser anchors just
        work. Pass `?redirect=false` to get the URL as JSON instead.

        **Name the file yourself** (`curl -L -o "<CODE>.imx"`). The redirect
        target does not always send a `Content-Disposition` header — the
        public `essence-1` URL sends none — so a filename-from-the-header
        flag such as `curl -LOJ` silently falls back to the last path segment
        of the request URL and writes a file called `download`. With
        `?redirect=false` the JSON carries the intended name in `filename`.

        The launchability gate doubles as the download gate: a family the
        agent can't be launched as (missing from `supported_models`) returns
        `409 MODEL_NOT_GENERATED`. A family the agent supports whose artifact
        hasn't been published to the download store yet returns
        `404 MODEL_ARTIFACT_NOT_READY` — the message says when to retry;
        **poll on that code**.

        **Every grant is recorded.** A model download costs **0 credits** on
        the [pricing table](https://docs.bithuman.ai/guides/pricing) — only
        runtime minutes bill — but the grant still writes exactly one usage row
        before the URL is issued, under the family's self-hosted pricing code,
        and hands you its id in `X-Bithuman-Meter-Id`. The rows show up in
        `GET /v1/usage` at 0 credits; they are a record of what you fetched,
        not a charge. The order matters both ways: a meter that refuses
        (`402`) or fails (`500`) returns no URL at all.

        The [bitHuman CLI](https://docs.bithuman.ai/sdk/cli/commands) wraps
        this endpoint: `bithuman pull <AGENT_CODE>` downloads the artifact,
        recognizes its model family, and prints what to do next.

        **Showcase identities need no credential.** The `essence-2` and
        `expression-2` identities listed by
        [`GET /v1/models/showcase`](#tag/Agent-Management/operation/getShowcaseManifest)
        are served to anonymous callers — same 302, same 1-hour signed URL, and
        the owner is charged **0 credits**. Every other agent still needs the
        `api-secret` header (or `Authorization: Bearer <api-secret | runtime
        token>`) and must be owned by the caller; an anonymous request for one
        answers `401 MISSING_AUTH`, the same answer an unknown code gets.
      # Showcase identities are served to anonymous callers; every other agent
      # needs the api-secret header. Both are valid, so a generated client does
      # not hard-require the header on a route that accepts a bare request.
      security:
        - apiSecret: []
        - {}
      tags: [Agent Management]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: >-
            Agent code. The agent must be owned by the caller (else 404) —
            except for the showcase identities in
            `GET /v1/models/showcase`, which are served with no credential.
          example: "A17ZTB0222"
        - name: model
          in: query
          required: false
          schema:
            type: string
            enum: [essence-1, essence-2, expression-2]
          description: >-
            Artifact family. Defaults to the agent's own model. The retired
            `essence-2-light` name and the runtime tier slugs (`essence-2-apple`,
            `essence-2-gpu`, `essence-2-cpu`, `expression-2-gpu`; the older
            `essence-2-ane` spelling stays accepted) fold onto
            their family. `essence-2-quality` is **no longer accepted** — it
            was retired on 2026-07-29 and now returns `400 VALIDATION_ERROR`;
            send `essence-2`. Any other unrecognized value returns the
            same `400`, listing the downloadable families.
          example: "expression-2"
        - name: member
          in: query
          required: false
          schema:
            type: string
          description: >-
            Fetch ONE on-device model member instead of the whole container.
            `essence-2` and `expression-2` publish a browser/Android bundle
            beside the container — a `web_manifest.json` and the members it
            lists (`combined_fp32.tflite`, `canon.bin`, ...) — and this serves
            a single one of them, so a browser or an Android runtime pulls only
            the lane it runs. Same entitlement as the container, same 1-hour
            signed URL, and the URL honours `Range` (`curl -L -r 0-1023`
            answers `206`, so OkHttp and browsers resume). Pass
            `web_manifest.json` first to learn the member names. A member of a
            **public** agent is served to an anonymous caller, like the browser
            already serves those agents; every other visibility needs the same
            credential as the container.
          example: "web_manifest.json"
        - name: plane
          in: query
          required: false
          schema:
            type: string
            enum: [android, web]
          description: >-
            Which member set `?member=` names. `essence-2` publishes two — one
            for browsers and one for Android — and twelve names appear in both
            of them, `manifest.json` among them. A browser asking for
            `manifest.json` and a handset asking for `manifest.json` want
            different files, so for those twelve the request has to say which
            set it means. Only meaningful alongside `member=`: the container
            itself has one form, so `plane=` on its own returns
            `400 VALIDATION_ERROR`, as does any value not listed above.
            **You can usually leave it out.** A member that appears in only one
            of the two sets identifies itself — which is why the Android
            runtime's first call, `member=android_store.v1.json`, resolves with
            no `plane=` at all. When a name appears in both and the request says
            nothing, it resolves to the browser set, so every caller written
            before this parameter behaves exactly as it did.
          example: "android"
        - name: redirect
          in: query
          required: false
          schema:
            type: string
            enum: ["false", "0", "no"]
          description: >-
            Pass `false` to receive the artifact URL as JSON (below) instead
            of a 302 redirect — for UIs that want to fetch or label first.
      responses:
        "302":
          description: >-
            Redirect to the artifact — a public URL for `essence-1`, a
            1-hour signed URL for the private families. Follow it and name
            the file yourself (`curl -L -o "<CODE>.imx"`); the target does
            not always send a `Content-Disposition` header.
          headers:
            Location:
              schema:
                type: string
              description: The artifact URL.
            X-Bithuman-Meter-Id:
              schema:
                type: string
              description: >-
                The id of the single `activities` row this grant wrote. Every
                download is metered BEFORE the URL is issued — a model download
                costs **0 credits** on the published
                [pricing table](https://docs.bithuman.ai/guides/pricing), and 0
                is a price, not a reason to skip the record. The row carries
                the family's self-hosted pricing code (e.g.
                `usage_essence_2_model_self_hosted`) and appears in
                `GET /v1/usage`; quote this id when reconciling one.
            X-Bithuman-Model:
              schema:
                type: string
              description: The canonical family actually served (`expression-2`, `essence-2`, ...).
            X-Bithuman-Model-Source:
              schema:
                type: string
              description: >-
                Why this family was chosen — `requested` when `?model=` named
                it, otherwise the agent's own default. Container arm only.
            X-Bithuman-Supported-Models:
              schema:
                type: string
              description: >-
                Comma-separated list of the other families this agent could
                have served, in the same public spellings `?model=` accepts —
                retry with one of them without a second request. Container arm
                only.
            X-Bithuman-Model-Member:
              schema:
                type: string
              description: The member name served. `?member=` arm only.
        "200":
          description: With `?redirect=false` — the artifact URL as JSON.
          headers:
            X-Bithuman-Meter-Id:
              schema:
                type: string
              description: >-
                The id of the single `activities` row this grant wrote. Every
                download is metered BEFORE the URL is issued — a model download
                costs **0 credits** on the published
                [pricing table](https://docs.bithuman.ai/guides/pricing), and 0
                is a price, not a reason to skip the record. The row carries
                the family's self-hosted pricing code (e.g.
                `usage_essence_2_model_self_hosted`) and appears in
                `GET /v1/usage`; quote this id when reconciling one.
            X-Bithuman-Model:
              schema:
                type: string
              description: The canonical family actually served (`expression-2`, `essence-2`, ...).
            X-Bithuman-Model-Source:
              schema:
                type: string
              description: >-
                Why this family was chosen — `requested` when `?model=` named
                it, otherwise the agent's own default. Container arm only.
            X-Bithuman-Supported-Models:
              schema:
                type: string
              description: >-
                Comma-separated list of the other families this agent could
                have served, in the same public spellings `?model=` accepts —
                retry with one of them without a second request. Container arm
                only.
            X-Bithuman-Model-Member:
              schema:
                type: string
              description: The member name served. `?member=` arm only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                        example: "A17ZTB0222"
                      model:
                        type: string
                        description: The resolved canonical family.
                        example: "expression-2"
                      filename:
                        type: string
                        example: "A17ZTB0222.imx"
                      url:
                        type: string
                        description: The artifact URL (signed, 1-hour TTL, for the private families).
                      expires_in:
                        type: [integer, "null"]
                        description: Signed-URL TTL in seconds (3600); `null` for the public essence-1 URL.
                        example: 3600
        "400":
          description: >-
            `VALIDATION_ERROR` — unknown `model` value (the message lists the
            downloadable families), or `MODEL_NOT_DOWNLOADABLE` — the family
            has no per-identity artifact to download (`expression-1` renders
            server-side from the agent's image).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: >-
            `INSUFFICIENT_BALANCE` — the download could not be metered against
            your account. Every grant writes its usage row BEFORE the URL is
            issued, so a refused meter returns **no URL at all** rather than an
            artifact nobody can account for. A download itself costs 0 credits;
            this is what a suspended or depleted account sees.
        "404":
          description: >-
            `NOT_FOUND` — agent unknown or not owned by this account; or
            `MODEL_ARTIFACT_NOT_READY` — the family is supported but its
            artifact hasn't been published to the download store yet. The
            message says when to retry; poll on this code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_ARTIFACT_NOT_READY"
                  message: "agent A17ZTB0222's expression-2 artifact isn't available for download yet: the Mac-runnable build is paced, typically within the hour"
                  httpStatus: 404
                status: "error"
                status_code: 404
        "409":
          description: >-
            `MODEL_NOT_GENERATED` — the requested family isn't in the agent's
            `supported_models` (same gate as embed/session launch), e.g.
            `agent <code>'s expression-2 model hasn't been generated yet`
            — create with, or add, that model to generate it.
        "429":
          description: Rate limited (read bucket) — `RATE_LIMITED`.
        "500":
          description: >-
            `INTERNAL_ERROR` — the artifact could not be resolved, or the usage
            row could not be written. In both cases **no URL is issued**: a
            grant we cannot record is not handed out. Safe to retry.
        "503":
          description: >-
            `SERVICE_UNAVAILABLE` — the download service briefly lost its
            connection to storage and could not recover within the request.
            **No URL is issued and nothing is metered.** Retry after the
            `Retry-After` delay; the same request then succeeds.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying (currently 2).

  /v1/files/upload:
    post:
      operationId: uploadFile
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/files/upload \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"file_url": "https://example.com/avatar.jpg", "file_type": "image"}'
      summary: Upload a file
      description: |
        Upload images, videos, audio, or documents. Files are auto-organized
        by type. Supports URL download or direct base64 upload.
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Upload by URL
                  required: [file_url]
