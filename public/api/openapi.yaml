openapi: 3.1.0
info:
  title: bitHuman
  version: "1.0"
  contact:
    name: bitHuman Support
    url: https://discord.gg/ES953n7bPA
  x-logo:
    url: https://docs.bithuman.ai/bithuman-mark.png
  description: |
    Real-time, lip-synced AI avatars: audio in, talking video out — on
    the cloud, on your own hardware, or in the browser. This is the REST
    contract; the guides, the SDKs and the CLI are on
    [docs.bithuman.ai](https://docs.bithuman.ai).

    All endpoints are relative to `https://api.bithuman.ai` and
    require an `api-secret` header.
    [Get a free API secret →](https://www.bithuman.ai/developer/api-keys)

    This machine-readable spec currently covers the core
    agent / video / dynamics / files / pricing surface. Some developer
    endpoint groups are documented in the markdown guides rather than
    here: [API keys](https://docs.bithuman.ai/api/api-keys)
    (`/v2/{user}/api-secrets*`),
    [runtime sessions](https://docs.bithuman.ai/api/runtime-sessions)
    (`/v2/{user}/runtime-sessions*`),
    [organizations](https://docs.bithuman.ai/api/organizations)
    (`/v2/organizations*`),
    [providers](https://docs.bithuman.ai/api/providers)
    (`/v2/{user}/providers`), and
    [knowledge](https://docs.bithuman.ai/api/knowledge)
    (`/v1/knowledge/*`). Purely internal / infrastructure routes —
    webhook receivers, `/func_*` generation internals, health/telemetry,
    and realtime session plumbing — are excluded entirely: they are not
    part of the public developer contract and may change without notice.

servers:
  - url: https://api.bithuman.ai
    description: Production

security:
  - apiSecret: []

paths:
  /v1/validate:
    post:
      operationId: validateApiSecret
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/validate \
              -H "api-secret: $BITHUMAN_API_SECRET"
            # → {"valid": true}
      summary: Validate API secret
      description: |
        Verify that your API secret is valid and your account is active.

        Always returns HTTP 200. Inspect the `valid` field in the body
        to determine outcome — invalid or missing credentials yield
        `{"valid": false}` rather than a 401.
      tags: [Authentication]
      responses:
        "200":
          description: Validation complete (check the `valid` field)
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true

  /v1/agent/generate:
    post:
      operationId: generateAgent
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/agent/generate \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{
                "prompt": "You are a friendly fitness coach who motivates users.",
                "image": "https://example.com/face.jpg",
                "model": "expression",
                "version": "v2",
                "aspect_ratio": "9:16",
                "framing": "portrait"
              }'
            # model+version selects the engine: expression+v2 → Expression 2.
            # Omit both to default to expression + v1 (Expression 1).
            # → {"success": true, "agent_id": "A91XMB7113", "status": "processing"}
            # then poll GET /v1/agent/status/A91XMB7113
      summary: Generate a new agent
      description: |
        Create a new avatar agent from a text prompt, with optional image
        and audio assets. Poll `/v1/agent/status/{agent_id}` to check
        progress.

        **Agent creation is image-only.** Provide a portrait `image` (or let
        the prompt generate one) — bitHuman generates a **10-second
        identity video internally**, authored to loop seamlessly (its
        first and last frames match). Video input is not part of the creation
        contract for any model and is being removed platform-wide: do not
        send `video` — as the rollout completes, a request carrying it is
        rejected with `400 VIDEO_INPUT_NOT_SUPPORTED` before anything is
        billed.

        **Selecting an engine.** Send `model` (`expression` default, or
        `essence`) + `version` (`v1` default, or `v2`). `expression`+`v2` →
        Expression 2, `essence`+`v2` → Essence 2, and so on. Omitting both
        gives Expression 1. Full engine names (`essence-1` … `expression-2`)
        and `auto` are still accepted directly.

        **Creation time depends on the resolved engine** (the second-generation
        models train real per-identity models — don't apply a 5-minute client
        timeout):

        | model + version | engine | identity input | creation time |
        |---|---|---|---|
        | `expression` + `v1` (default) | Expression 1 | image (or generated from prompt) | **1 min** |
        | `essence` + `v1` | Essence 1 | image (or generated from prompt) | **13 min** |
        | `expression` + `v2` | Expression 2 | image (or generated from prompt) | **2 h 02 m** |
        | `essence` + `v2` | Essence 2 | image (or generated from prompt) — a 10-second identity video is generated internally | **2 h 09 m** — **both Essence 2 models from one creation** |
        | `auto` | classified | image or prompt (classified automatically) | as the routed model (`essence-2` or `expression-2`) |

        Those are one creation per engine, measured end to end on
        **2026-09-20** from this call to `status: "ready"` on
        `GET /v1/agent/status/{agent_id}`. Read them as one observed range,
        not a guarantee: **under 15 minutes for either first-generation
        engine, and about 2 to 2.5 hours for either second-generation one**,
        with individual runs going longer. Neither second-generation engine
        is the fast one — size timeouts in hours for both.

        **Picking the right family:** `essence-2` works best for
        photorealistic human figures; `expression-2` works best for
        cartoonish, stylized, animal, creature, or robot characters. Send
        `model: "auto"` to apply this rule automatically — the platform
        classifies your input and records the recommended model either way.

        **Subject requirement (Essence 2):** `essence-2` requires a **photorealistic
        human** subject. The input is classified before anything is billed; a
        cartoon / animal / creature / robot input is rejected with
        `422 MODEL_SUBJECT_MISMATCH` (nothing charged) — use `expression-2`
        for those characters, or send `model: "auto"` to route
        automatically.

        Failures during generation surface as `status: "failed"` with an
        `error_message` on the status endpoint, and the creation credits
        are automatically refunded.
      tags: [Agent Generation]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional. A unique client-generated key (e.g. a UUID). Retrying with the same key returns the original response instead of starting a second billed job. Keys are retained for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: System prompt / personality for the agent. If omitted, a random default is used.
                  example: "You are a friendly fitness coach who motivates users."
                image:
                  type: string
                  description: >-
                    URL to a face image for avatar appearance. For the best
                    likeness use a photo with one clear figure, a neutral
                    expression, facing the camera, a relaxed pose, and no
                    occlusion of the face. This is guidance, not validation —
                    nothing inspects or rejects the photo you send.
                  example: "https://example.com/face.jpg"
                audio:
                  type: string
                  description: URL to audio for voice cloning.
                  example: "https://example.com/voice.wav"
                aspect_ratio:
                  type: string
                  enum: ["16:9", "9:16", "1:1"]
                  default: "16:9"
                  description: >-
                    Aspect ratio for the generated identity image and driver
                    video. `16:9` landscape (default), `9:16` portrait, `1:1`
                    square. Images are generated at 1080p on this ratio.
                transparency:
                  type: boolean
                  default: false
                  description: >-
                    When `true`, the identity image is generated on a solid
                    green-screen background (chroma-key friendly) so the avatar
                    can be embedded transparently — the character itself never
                    uses green. Leave `false` for a normal scene background.
                framing:
                  type: string
                  enum: [portrait, full_body]
                  default: portrait
                  description: >-
                    `portrait` (default) frames head-and-shoulders; `full_body`
                    shows the full figure including the feet — use it for
                    kiosk / standing-avatar layouts.
                agent_id:
                  type: string
                  description: Custom agent identifier. Auto-generated if omitted.
                duration:
                  type: integer
                  deprecated: true
                  description: >-
                    **Deprecated — omit it.** The internally generated
                    identity/driver video is standardizing on 10 seconds
                    (authored to loop seamlessly); the parameter is ignored
                    as that rollout completes.
                model:
                  type: string
                  enum: [expression, essence, essence-1, essence-2, expression-1, expression-2, auto]
                  default: expression
                  example: expression
                  description: >-
                    Avatar model **family**: `expression` (default) or
                    `essence`, combined with `version` (`v1` / `v2`) to select
                    the engine — `expression`+`v1` → Expression 1,
                    `essence`+`v2` → Essence 2, and so on. **Essence** is the
                    photorealistic-human engine; **Expression** drives stylized /
                    cartoon / creature characters (and photorealistic figures on
                    v1). An omitted `model` defaults to `expression` at version
                    `v1` (Expression 1) — a v1 engine at the 250-credit rate; an
                    omitted model never silently selects a v2 engine or a higher
                    price.


                    You may still pass a **full engine name** directly
                    (`essence-1`, `essence-2`, `expression-1`, `expression-2`)
                    or `auto`; those pass through unchanged and `version` is
                    ignored, so existing integrations keep working.
                    **`essence-2`** is the second-generation Essence model for
                    photorealistic people — one 500-credit creation that runs
                    everywhere from on-device (CPU / Apple Silicon) up to
                    cloud GPU. (`essence-2-light` is a retired alias — the
                    public name is `essence-2`.) Request it as `essence-2`
                    (or `essence` + `v2`).
                    **`expression-2`** is the second-generation
                    expression engine — audio-driven real-time avatar video from
                    a single photo (creation trains a per-identity model —
                    about 2 hours, as does `essence-2`; see the creation-time
                    table above). **`auto`** classifies your input (the image if
                    provided, else the prompt): a photorealistic person routes to
                    `essence-2`, a cartoon / animal / creature / robot to
                    `expression-2`. Retired engine names return
                    `400 VALIDATION_ERROR`. Identity inputs and creation times
                    differ per model — see the endpoint description table and
                    [Essence vs Expression](#tag/models).
                version:
                  type: string
                  enum: [v1, v2]
                  default: v1
                  example: v2
                  description: >-
                    Engine generation for the chosen `model` family. `v1`
                    (default) selects the first-generation engine (Essence 1 /
                    Expression 1, 250 credits); `v2` selects the
                    second-generation engine (Essence 2, 500 credits, or
                    Expression 2, 2000 credits). Ignored when `model` is a full
                    engine name or `auto`.
      responses:
        "200":
          description: Generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Agent generation started"
                  agent_id:
                    type: string
                    example: "A91XMB7113"
                  status:
                    type: string
                    example: "processing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: >-
            Insufficient credits. Creation is billed **per model** —
            `expression-2` costs 2000 credits; `essence-2` costs 500;
            `auto` bills the
            routed model's rate (500 or 2000); the v1 families (`essence-1`,
            `expression-1`) cost 250. Top up to continue. Returns error code
            `INSUFFICIENT_BALANCE`.
        "400":
          description: >-
            Body failed validation — malformed JSON, an invalid / retired
            `model` value (`VALIDATION_ERROR` — the message lists the
            accepted model names), or a `video` input
            (`VIDEO_INPUT_NOT_SUPPORTED` — agent creation is image-only; the
            10-second identity video is generated internally so it loops
            seamlessly; this rejection is rolling out platform-wide, so
            never send `video`). Rejected before dispatch; no credits
            charged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                validation_error:
                  summary: Invalid model value
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid model 'my-model'; must be one of: auto, essence, essence-1, essence-2, expression, expression-1, expression-2"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
                video_input_not_supported:
                  summary: Video creation input (image-only contract)
                  value:
                    error:
                      code: "VIDEO_INPUT_NOT_SUPPORTED"
                      message: "Agent creation is image-only. Provide a portrait `image`; bitHuman generates a 10-second idle/driver video internally so it loops seamlessly (first frame == last frame). Video input is not accepted for any model (essence-1, expression-1, essence-2, expression-2)."
                      httpStatus: 400
                    status: "error"
                    status_code: 400
        "422":
          description: >-
            `MODEL_SUBJECT_MISMATCH` — an explicit Essence 2 creation
            (`essence-2`) whose input
            is not a photorealistic human subject. The classifier runs on the
            image if provided, else the prompt, **before anything is billed**
            and before any agent row is created. Use `expression-2` for
            cartoon / animal / creature / robot subjects, or `model: "auto"`
            (which never rejects — it routes instead). A classifier outage never
            blocks creation (the gate fails open).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_SUBJECT_MISMATCH"
                  message: "essence-2 requires a photorealistic human subject; this image looks like a cartoon — use expression-2"
                  httpStatus: 422
                status: "error"
                status_code: 422
        "503":
          description: >-
            `MODEL_NOT_YET_AVAILABLE` — the requested second-generation model
            (`essence-2`, `expression-2`, or `auto`, which
            routes only to them) can't accept creations right now. Essence 2
            and Expression 2 have been generally available since their
            July 10, 2026 launch, so this is a rare, temporary operational
            pause — returned **before any dispatch or charge**.
            The v1 families (`essence-1`, `expression-1`) always work; retry
            the v2 model shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_NOT_YET_AVAILABLE"
                  message: "expression-2 isn't available for generation yet. Specify 'essence-1' or 'expression-1' to generate now."
                  httpStatus: 503
                status: "error"
                status_code: 503

  /v1/agent/status/{agent_id}:
    get:
      operationId: getAgentStatus
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v1/agent/status/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET"
            # poll every 5 s until data.status is "ready" (or "failed").
            # "success" is a STEP marker written mid-run — not terminal unless progress == 1.0
      summary: Get agent generation status
      description: |
        Poll this endpoint to check generation progress. Status values:
        `processing`, `generating`, `completed`, `success` (all intermediate);
        `ready` (terminal success); `failed` (terminal error).

        **Keep polling past `generating`, `completed` and `success`** — those
        are intermediate states, not terminal. `completed` can appear early
        (even around ~5% `progress`), and `success` is a STEP-level marker the
        voice/image and video steps each write (~20% and ~45% `progress`), so
        do not stop on either. Only `ready` and `failed` mean polling should
        stop — or `success` when `progress` has also reached `1.0`.

        `current_step` reports the pipeline stage: `payment` (~2%) →
        `persona` (5–15%) → `voice_image` (~20%) → `video` (~45%, the
        internally generated 10-second identity video — models that need
        one) → `lip_sync` (70–99%, the
        model-specific identity step — training/distillation for
        `expression-2` / `essence-2`, so the longest stage) → `done`
        (100%). A rare `essence-1` path reports `awaiting_face_marking`
        (~35%).

        Recommended polling interval: 5 seconds. Size your overall timeout to
        the model: minutes for the first-generation engines, **hours** for
        both second-generation ones — measured 2026-09-20, `expression-2`
        took 2 h 02 m and `essence-2` 2 h 09 m from creation to `ready`
        (see [creation times](#operation/generateAgent)).

        **`ready` does not yet mean downloadable.** The agent can be launched
        and embedded as soon as it reports `ready`, but the downloadable
        model file is published separately, shortly afterwards. Until it is,
        `GET /v1/agent/{code}/model/download` answers
        `404 MODEL_ARTIFACT_NOT_READY` — a retryable code, not a failure. On
        2026-09-20 an `expression-2` agent was still answering it 23 minutes
        after it reported `ready`. Poll the download on that code.
      tags: [Agent Generation]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      responses:
        "200":
          description: >-
            Agent status. `data` is the agent's full record — the same shape
            `GET /v1/agent/{code}` returns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/{code}:
    get:
      operationId: getAgent
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v1/agent/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET"
      summary: Get agent details
      description: Retrieve full details for an agent by its code.
      tags: [Agent Management]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/EdgeBadGateway"
    post:
      operationId: updateAgent
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/agent/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"system_prompt": "You are a professional sales assistant."}'
      summary: Update an agent's prompt or providers
      description: |
        Update an existing agent's system prompt, its provider selection, or
        both. The agent must already exist (use `POST /v1/agent/generate` to
        create one). Send at least one of `system_prompt` and `providers` — a
        body with neither is rejected `400 MISSING_PARAM`.

        **An agent's `name` cannot be set here, and cannot be set at
        creation either.** Names are generated from the agent's prompt and
        portrait. A body whose only field is `name` changes nothing and
        returns `400 MISSING_PARAM`; sending `name` alongside `system_prompt`
        updates the prompt and ignores the name.
      tags: [Agent Management]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send `system_prompt`, `providers`, or both. Any other field is ignored.
              properties:
                system_prompt:
                  type: string
                  description: New system prompt for the agent.
                  example: "You are a professional sales assistant."
                providers:
                  type: object
                  description: >-
                    Which provider each capability uses for this agent. Give a
                    capability `"default"` to use the platform's own provider,
                    or an object `{"mode": "custom", "provider_id": "<id>"}` to
                    point it at one you registered yourself. The patch is
                    merged, so a capability you omit keeps its current
                    selection. An unknown capability name, an unusable
                    selection, or a `provider_id` that is not registered on
                    your account is refused `400 VALIDATION_ERROR` at write
                    time with the reason — nothing is stored half-configured.
                  additionalProperties: false
                  properties:
                    llm:
                      $ref: "#/components/schemas/ProviderSelection"
                    stt:
                      $ref: "#/components/schemas/ProviderSelection"
                    tts:
                      $ref: "#/components/schemas/ProviderSelection"
                    realtime:
                      $ref: "#/components/schemas/ProviderSelection"
                  example:
                    llm: { mode: "custom", provider_id: "43c9a2a3-8664-4a33-a66d-77490256e7e1" }
                    tts: "default"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_code:
                    type: string
                    example: "A91XMB7113"
                  updated:
                    type: boolean
                    example: true
              example:
                agent_code: "A91XMB7113"
                updated: true
        "400":
          description: >-
            Nothing to update, or a `providers` patch that cannot be stored.
            `MISSING_PARAM` — the body carried neither `system_prompt` nor
            `providers` (an empty body, or one whose only field is `name`).
            `VALIDATION_ERROR` — malformed JSON, or a `providers` patch naming
            an unknown capability, an unusable selection, or a `provider_id`
            that is not registered on your account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                nothing_to_update:
                  summary: Neither field sent
                  value:
                    error:
                      code: "MISSING_PARAM"
                      message: "Nothing to update — send 'system_prompt' and/or 'providers'"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
                unregistered_provider:
                  summary: A provider id this account has not registered
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "provider_id 'does-not-exist' is not registered on this account"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAgent
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X DELETE https://api.bithuman.ai/v1/agent/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET"
            # → {"success": true, "agent_code": "A91XMB7113", "deleted": true}
      summary: Delete an agent
      description: |
        Permanently delete an agent you own. Stored assets are cleaned up
        best-effort; usage history is retained. Deleting a missing or
        non-owned agent returns 404.
      tags: [Agent Management]
      security:
        - apiSecret: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  agent_code:
                    type: string
                    example: "A91XMB7113"
                  deleted:
                    type: boolean
                    example: true
                  artifact_cleanup:
                    type: string
                    description: >-
                      How far the removal of the agent's stored assets has
                      got. `pending` means the delete has been accepted and
                      the files are still being removed in the background —
                      the agent is already gone from `GET /v1/agents` and
                      every route answers `404` for its code.
                    example: "pending"
                  billing_history:
                    type: string
                    description: >-
                      What happened to this agent's billing records. The
                      per-call rows go with the agent; the account-level
                      summaries they roll up into are retained, so your
                      invoice does not change.
                    example: "removed_summary_retained"
              example:
                success: true
                agent_code: "A91XMB7113"
                deleted: true
                artifact_cleanup: "pending"
                billing_history: "removed_summary_retained"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/agent/{code}/speak:
    post:
      operationId: agentSpeak
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/agent/A91XMB7113/speak \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"message": "Hello! Welcome to our demo."}'
      summary: Make agent speak
      description: |
        Send text for the avatar to speak aloud. With `room_id` it goes to that
        one session; without it, to every deliverable session of the agent.
        The agent must be in at least one active LiveKit room.
      tags: [Agent Context]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
