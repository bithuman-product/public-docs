                  example: "F1"
                axes:
                  type: object
                  description: Optional map of axis-name → float value. Omit to preview the unedited base voice.
                  additionalProperties:
                    type: number
                  example:
                    pitch: 0.15
                    brightness: -0.10
                language:
                  type: string
                  default: "en"
      responses:
        "200":
          description: Audio bytes (WAV).
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/agents:
    get:
      operationId: listAgents
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl "https://api.bithuman.ai/v1/agents?limit=20&status=ready" \
              -H "api-secret: $BITHUMAN_API_SECRET"
      summary: List agents
      description: |
        List the agents owned by your API secret, newest first. Paginated.

        Each item is a **summary**, not the full agent record: it carries the
        identity, the state and the launch surface, and nothing else. The
        prompt, the progress fields, the media URLs and the model handle are
        only on [`GET /v1/agent/{code}`](#operation/getAgent) — a caller that
        reads them from a list item reads fields that are not there.

        **Deleted agents are listed too**, with `status: "deleted"` and their
        other fields nulled. Pass `?status=ready` (or filter on the field) if
        you want only live agents.
      tags: [Agent Management]
      security:
        - apiSecret: []
      parameters:
        - name: limit
          in: query
          description: Page size (1–100).
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          description: Number of agents to skip.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: status
          in: query
          description: Filter by generation state (e.g. `ready`, `processing`, `failed`).
          schema: { type: string }
      responses:
        "200":
          description: A page of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgentListItem" }
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
