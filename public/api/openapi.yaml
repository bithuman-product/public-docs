  # ── Self-hosting: the two routes a self-hosted runtime actually calls ──
  # (added 2026-09-07; both answered live and were absent from this file.)
  /v1/auth/validate:
    post:
      operationId: validateSelfHostedKey
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/auth/validate \
              -H "Authorization: Bearer $BITHUMAN_API_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"billing_type": "self-hosted-essence-2-model"}'
            # → {"user_id": "...", "key_id": "key_1a2b3c4d5e6f7a8b"}
      summary: Live key check for a self-hosted runtime
      description: |
        A self-hosted container calls this once per render start and once per
        billing beat (with a short positive cache), so **deleting a key in the
        dashboard stops that container on its next beat**. An allowlist baked
        into a container at start is not revocable; this endpoint is what makes
        it revocable.

        The three answers are deliberately distinct, and a runtime must treat
        them differently:

        | status | meaning | what a runtime should do |
        |---|---|---|
        | `200` | valid | serve |
        | `401` | **definite**: unknown, revoked or disabled | stop |
        | `503` | we cannot tell right now | retry, keep serving |

        The 401 does not say *which* of unknown/revoked/disabled — a distinct
        "revoked" answer would be a key-existence oracle for anyone probing keys
        they do not own. And an outage of ours must never present to your users
        as your key being revoked, which is what the 503 exists for.

        `key_id` is a non-secret handle (`"key_" + sha256(secret)[:16]`) that
        your runtime can derive locally, so a validation here and a beat there
        describe the same key without either side storing the secret.
      tags: [Self-hosting]
      security:
        - bearerApiSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_type:
                  type: string
                  description: |
                    The self-hosted product this runtime serves. Always send
                    the key for the product you run.
                  example: "self-hosted-essence-2-model"
      responses:
        "200":
          description: The key is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: |
                      The account this key bills to. A response with no
                      `user_id` must be treated as a failure — an
                      identity-less "ok" cannot be billed to anybody.
                  key_id:
                    type: string
                    example: "key_1a2b3c4d5e6f7a8b"
        "401":
          description: Definite — unknown, revoked or disabled key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfHostError" }
        "429":
          description: Too many failed validations from this IP.
        "503":
          description: |
            We cannot validate right now. Retry (a `Retry-After` header is
            sent) and keep serving — this is not a statement about your key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfHostError" }

  /v1/meter/beats:
    post:
      operationId: postMeterBeat
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/meter/beats \
              -H "Authorization: Bearer $BITHUMAN_API_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"session_id":"s-1","install_id":"i-1","seq":1,
                   "served_s":60,"billing_type":"self-hosted-essence-2-model"}'
      summary: Report a billing beat from a self-hosted session
      description: |
        A self-hosted or on-device runtime posts one beat per interval to bill
        the session it is serving. Beats are the self-hosted meter: see
        [Pricing](#tag/pricing) for the per-minute rate.

        **Billing is wall-clock, and idle time counts.** A beat reports the
        seconds of session that elapsed, not frames rendered.

        The beat names its own product with `billing_type` (the same wire
        string every bitHuman runtime already sends). The product is resolved
        **once, on the first beat of a session**, and then pinned to the ledger
        row: a later beat cannot re-price a session that is already open.

        A runtime should read **only the status code**:

        | status | meaning | what a runtime should do |
        |---|---|---|
        | `2xx` | the interval is durably recorded | advance the meter clock |
        | `402` | balance depleted / account suspended | **keep rendering**, do not advance the clock |
        | `401` | definite bad key | stop |
        | `503` | we cannot tell right now | retry |

        The 402 is not a kill switch by design: a paid render is never killed
        mid-frame. Depletion gates the *next* session, through
        [`/v1/auth/validate`](#operation/validateSelfHostedKey).

        `session_id` + `install_id` + your account make the beat idempotent, so
        a retried beat never double-charges.
      tags: [Self-hosting]
      security:
        - bearerApiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, seq, served_s]
              properties:
                session_id:
                  type: string
                  maxLength: 128
                  description: Stable id for the session being billed.
                install_id:
                  type: string
                  maxLength: 128
                  description: Stable id for this installation.
                seq:
                  type: integer
                  minimum: 1
                  description: Beat sequence number within the session.
                served_s:
                  type: number
                  description: |
                    Seconds of session covered by this beat. Clamped
                    server-side; wall-clock, idle included.
                billing_type:
                  type: string
                  description: |
                    The self-hosted product wire key. Always send the key
                    for the product you run.
                  example: "self-hosted-essence-2-model"
      responses:
        "200":
          description: The interval is durably recorded. Advance the meter clock.
        "400":
          description: Malformed beat (`session_id` and a positive `seq` are required).
        "401":
          description: Definite — unknown, revoked or disabled key.
        "402":
          description: |
            Balance depleted or account suspended. Do **not** advance the meter
            clock; keep rendering.
        "503":
          description: We cannot record right now. Retry.

  /readyz:
    get:
      operationId: getReadiness
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/readyz
            # → {"status":"ok","families":{"sessions":{"status":"ok"}, ...}}
      summary: API readiness
      description: |
        Whether the API is currently **refusing work**, per route family, over a
        rolling window. No credential required.

        **Always HTTP 200, deliberately** — read the `status` field, not the
        status code. A readiness route that answered 503 would invite being
        wired to a rotation decision, and what this reports is that an upstream
        is full, which taking the edge out of rotation would make worse.

        `status` is `ok` | `degraded` | `unhealthy`, and each entry in
        `families` carries the same verdict for one route family. The reply
        describes **the replica that answered it**, not the fleet
        (`replica_scope` says so) — for an overall view use
        [status.bithuman.ai](https://status.bithuman.ai).

        This is distinct from liveness: `GET /health` answers a static 200 from
        the edge and cannot tell you whether anything is being refused.
      tags: [Status]
      security: []
      responses:
        "200":
          description: The readiness verdict for the replica that answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, unhealthy]
                  window_seconds:
                    type: number
                    example: 900
                  observed_seconds:
                    type: number
                    description: |
                      How much of the window this replica has actually been up
                      for. A young replica reporting `ok` is saying little.
                  replica_scope:
                    type: string
                    example: "this process only — not a fleet view"
                  families:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [ok, degraded, unhealthy]

components:
  securitySchemes:
    apiSecret:
      type: apiKey
      name: api-secret
      in: header
      description: |
        Your bitHuman API secret. Get one at
        [www.bithuman.ai/developer/api-keys](https://www.bithuman.ai/developer/api-keys).
    bearerApiSecret:
      type: http
      scheme: bearer
      description: |
        The same API secret, sent as `Authorization: Bearer <api-secret>`. Self-
        hosted runtimes send it this way; the classic `api-secret` header works
        on the same routes.

  schemas:
    SelfHostError:
      type: object
      description: |
        The error envelope the self-hosting routes return. `error.type` is the
        machine-readable word a runtime switches on; `error.code`,
        `error.httpStatus` and `error.message` are the platform envelope every
        other endpoint uses. Both are present on purpose — the self-hosted
        container's key validator reads `type`, and the additive `code` means a
        developer switching on `error.code` no longer gets `undefined` from
        these routes.
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: "missing_credentials"
            code:
              type: string
              example: "MISSING_AUTH"
            httpStatus:
              type: integer
              example: 401
            message:
              type: string
    ProviderSelection:
      description: >-
        Which provider one capability uses. `"default"` is the
        platform's own provider; the object form points the capability at an
        entry you registered with `PUT /v2/{user_id}/providers`.
      oneOf:
        - type: string
          enum: [default]
        - type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [default, custom]
            provider_id:
              type: string
              description: >-
                Required when `mode` is `custom`: the `id` of one of your
                registered provider entries. `providerId` is accepted as a
                spelling of the same field. An id this account has not
                registered is refused `400 VALIDATION_ERROR`.
              example: "43c9a2a3-8664-4a33-a66d-77490256e7e1"

    ModelStatusEntry:
      type: object
      description: Per-family readiness for one of the agent's models.
      properties:
        state:
          type: string
          description: >-
            `ready` when the agent can be launched as this family, `pending`
            while it is still being prepared.
          example: "ready"
        reason:
          type: string
          nullable: true
          description: Why the family is not ready yet; `null` once it is.
          example: "this model is still being prepared for this agent"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this family last changed state. `null` for a family that was
            available from the agent's creation and never transitioned.
          example: "2026-09-20T15:50:15.910740+00:00"

    Agent:
      type: object
      description: >-
        An agent's full record, as returned by `GET /v1/agent/{code}` and
        `GET /v1/agent/status/{agent_id}`. Every field below is present on
        every response; fields that do not apply to the agent are `null`
        rather than absent. `GET /v1/agents` returns a shorter summary — see
        `AgentListItem`.
      properties:
        code:
          type: string
          description: The agent's short code — the primary identifier used across the platform and the embed/viewer URLs.
          example: "A91XMB7113"
        agent_id:
          type: string
          description: The same value as `code`, under the name the creation response uses.
          example: "A91XMB7113"
        name:
          type: string
          nullable: true
          description: >-
            The agent's display name. **Generated** from the prompt and
            portrait during the `persona` step — it cannot be supplied at
            creation or changed afterwards, and it is `null` until that step
            completes.
          example: "Fitness Coach"
        description:
          type: string
          nullable: true
          description: Generated one-paragraph description of the agent. `null` until the `persona` step completes.
        language:
          type: string
          nullable: true
          description: Detected/assigned language tag, e.g. `en`.
          example: "en"
        gender:
          type: string
          nullable: true
          example: "masculine"
        model:
          type: string
          nullable: true
          description: The model family the agent was created with.
          example: "expression-2"
        supported_models:
          type: array
          items: { type: string }
          description: >-
            Canonical model families this agent can be launched as right now
            — `essence-1` when its `.imx` exists, and `essence-2` /
            `expression-2` once their
            trained per-identity model has been generated. Tier slugs inherit
            their family and are not listed.
          example: ["essence-1", "essence-2"]
        model_status:
          type: object
          description: >-
            Readiness per model family, keyed by family name. A family is
            listed here before it is launchable, with the reason it is not —
            so a caller can tell "still training" from "never requested".
            `supported_models` is the `ready` subset of these keys.
          additionalProperties:
            $ref: "#/components/schemas/ModelStatusEntry"
          example:
            expression-2: { state: "ready", reason: null, updated_at: "2026-09-20T15:50:15.910740+00:00" }
        subject:
          type: string
          nullable: true
          description: The subject class the creation classifier recorded for the input, when one was run.
        system_prompt:
          type: string
          nullable: true
          example: "You are a friendly fitness coach."
        image_url:
          type: string
          nullable: true
          description: Avatar face image URL.
        image_path:
          type: string
          nullable: true
          description: The stored location of the portrait. Same value as `image_url` for agents whose portrait is public.
        video_url:
          type: string
          nullable: true
          description: >-
            The agent's identity video URL — generated internally at
            creation (10 seconds, authored to loop seamlessly). Read-only
            output; video is never a creation input.
        video_path:
          type: string
          nullable: true
          description: The stored location of the identity video. Same value as `video_url` for agents whose video is public.
        model_url:
          type: string
          nullable: true
          description: >-
            Where the model artifact lives. For `essence-1` this is a
            fetchable URL; for the second-generation families it is an
            opaque stored handle, **not** a link you can download. Use
            [the download endpoint](#operation/downloadAgentModel) to get the
            file itself.
        model_path:
          type: string
          nullable: true
          description: The same stored handle as `model_url`, under its storage-side name.
        model_hash:
          type: string
          nullable: true
          description: Content digest of the model artifact, when one has been recorded.
        voice_id:
          type: string
          nullable: true
          description: Voice identifier.
        voice_path:
          type: string
          nullable: true
          description: The same value as `voice_id`, under its storage-side name.
        status:
          type: string
          description: >-
            Current agent state — `processing`, `generating`, `completed`,
            `success` (all intermediate), `ready` (terminal success) or
            `failed` (terminal error). `deleted` for a deleted agent.
          example: "ready"
        event_type:
          type: string
          nullable: true
          description: Most recent pipeline event, e.g. `persona_created`, `voice_created`, `video_created`, `lip_created`.
        progress:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: Generation progress as a fraction from 0.0 to 1.0.
        progress_msg:
          type: string
          nullable: true
          description: Human-readable progress description.
        current_step:
          type: string
          nullable: true
          description: >-
            Current generation step. Known values: `payment`, `persona`,
            `voice_image`, `video`, `awaiting_face_marking`, `lip_sync`,
            `done`.
          example: "done"
        error_message:
          type: string
          nullable: true
          description: Error details when `status` is `failed`; `null` otherwise.
        error_type:
          type: string
          nullable: true
          description: Which stage the failure came from; `null` when the agent has not failed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        dynamics:
          type: object
          nullable: true
          description: Gesture configuration and available gestures. `{}` when none are configured.

    AgentListItem:
      type: object
      description: >-
        One agent as `GET /v1/agents` returns it — a summary, not the full
        record. Every field below is present on every item; the detail fields
        (`system_prompt`, `progress`, `model_url`, the media URLs, …) are
        **not** part of this shape, so read them from
        `GET /v1/agent/{code}` instead of expecting them here.
      properties:
        code:
          type: string
          example: "A91XMB7113"
        agent_id:
          type: string
          description: The same value as `code`.
          example: "A91XMB7113"
        name:
          type: string
          nullable: true
          description: Generated display name; `null` before the persona step and for deleted agents.
          example: "Fitness Coach"
        description:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
          example: "expression-2"
        gender:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
          example: "en"
        image_path:
          type: string
          nullable: true
          description: Portrait URL.
        thumbnail_path:
          type: string
          nullable: true
          description: Thumbnail URL for the portrait.
        status:
          type: string
          description: >-
            Generation state — `processing`, `generating`, `completed`,
            `success`, `ready`, `failed` — or `deleted` for an agent you
            deleted, or `unknown`. **Deleted agents stay in this listing**;
            filter them out with `?status=ready` or on the field.
          example: "ready"
        supported_models:
          type: array
          items: { type: string }
          description: Model families this agent can be launched as right now; `[]` while it is still generating.
          example: ["essence-1", "essence-2"]
        model_status:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelStatusEntry"
          description: Readiness per model family; `{}` while the agent is still generating.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        total:
          type: integer
          description: Total matching rows across all pages.
          example: 137
        has_more:
          type: boolean
          example: true

    UsageEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        activity_type:
          type: string
          example: "bithuman-serve"
        pricing_code:
          type: string
          example: "usage_essence_model_self_hosted"
        app:
          type: string
          example: "imaginex"
        agent_code:
          type: [string, "null"]
        credits_change:
          type: number
          description: Signed credit delta; usage events are positive credits consumed.
          example: 1
        frames_rendered:
          type: [integer, "null"]
        room_name:
          type: [string, "null"]
        start_time:
          type: [string, "null"]
          format: date-time
        end_time:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          example: "https://example.com/bithuman/webhook"
        events:
          type: array
          items:
            type: string
          description: Subscribed event types; empty means all.
          example: ["agent.ready", "agent.failed"]
        description:
          type: [string, "null"]
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            secret:
              type: string
              description: |
                HMAC-SHA256 signing secret, returned **only once** at creation.
                Verify deliveries with
                `sha256 = HMAC(secret, "{X-BitHuman-Timestamp}.{raw_body}")`
                and compare against the `X-BitHuman-Signature` header.
              example: "whsec_60fe3d…"

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          example: "agent.ready"
        status_code:
          type: [integer, "null"]
          description: HTTP status returned by your endpoint; null on network error/timeout.
          example: 200
        attempts:
          type: integer
          example: 1
        delivered:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "UNAUTHORIZED"
            message:
              type: string
              example: "Invalid API secret"
            httpStatus:
              type: integer
              example: 401
        status:
          type: string
          example: "error"
        status_code:
          type: integer
          example: 401

  responses:
    BadRequest:
      description: Missing required parameter or malformed request. The HTTP status equals `status_code` (400).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "MISSING_PARAM"
              message: "Missing required field: text"
              httpStatus: 400
            status: "error"
            status_code: 400

    Unauthorized:
      description: |
        Authentication failed. `UNAUTHORIZED` when the `api-secret` header is
        present but invalid; `MISSING_AUTH` when it is absent. The HTTP status
        equals `status_code` (401).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Invalid API secret"
              httpStatus: 401
            status: "error"
            status_code: 401

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "NOT_FOUND"
              message: "Agent not found"
              httpStatus: 404
            status: "error"
            status_code: 404

    ValidationError:
      description: Body failed schema validation. The HTTP status equals `status_code` (400).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Invalid request parameters"
              httpStatus: 400
            status: "error"
            status_code: 400

    EdgeBadGateway:
      description: >-
        Raised by the content delivery network in front of the API, before the
        request reaches it. **The body is an HTML page, not the JSON envelope
        every other status uses** — check `Content-Type` before parsing a 5xx.
        A `Retry-After` header is present, so an ordinary retry helper still
        works. Any route can answer this.
      content:
        text/html:
          schema:
            type: string
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.

    EdgeGatewayTimeout:
      description: >-
        The request reached the content delivery network in front of the API
        but no response came back in time. **The body is an HTML page, not the
        JSON envelope every other status uses** — check `Content-Type` before
        parsing a 5xx. A `Retry-After` header is present, so an ordinary retry
        helper still works. Any route can answer this; the long-running
        routes are the likeliest.
      content:
        text/html:
          schema:
            type: string
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.

