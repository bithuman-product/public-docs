tags:
  ##########################################################################
  # Prose-only sections (no operations). Scalar lists them in the sidebar via
  # x-tagGroups. Each is one sentence and the page that owns the subject —
  # the docs site is the one writer for guides and concepts, and this spec
  # used to carry a second, older copy of every one of them.
  ##########################################################################
  - name: overview
    x-displayName: Overview
    description: "What bitHuman is, where an avatar renders and what you can build: [https://docs.bithuman.ai/api/overview](https://docs.bithuman.ai/api/overview)."
  - name: quickstart
    x-displayName: Quickstart
    description: "Your first talking avatar, with curl and a hosted agent: [https://docs.bithuman.ai/api/quickstart](https://docs.bithuman.ai/api/quickstart)."
  - name: auth-guide
    x-displayName: Authentication
    description: "API secrets, runtime tokens and where each surface reads its key: [https://docs.bithuman.ai/api/authentication](https://docs.bithuman.ai/api/authentication)."
  - name: models
    x-displayName: Models
    description: "Essence 2, Expression 2 and the first generation — what each does and where each runs: [https://docs.bithuman.ai/concepts/models-v2](https://docs.bithuman.ai/concepts/models-v2)."
  - name: pricing
    x-displayName: Pricing
    description: "Credits per minute by model and surface, creation costs and plans: [https://docs.bithuman.ai/guides/pricing](https://docs.bithuman.ai/guides/pricing)."
  - name: avatars-imx
    x-displayName: Avatars & .imx files
    description: "The downloadable model file, how it is addressed by agent code and how to inspect it: [https://docs.bithuman.ai/concepts/avatars-imx](https://docs.bithuman.ai/concepts/avatars-imx)."
  - name: audio-streaming
    x-displayName: Audio streaming
    description: "The push/drain contract every SDK shares — PCM in, lip-synced frames out: [https://docs.bithuman.ai/concepts/audio-streaming](https://docs.bithuman.ai/concepts/audio-streaming)."
  - name: agent-lifecycle
    x-displayName: Agent lifecycle
    description: "Generate, poll, resolve and drive an agent over the API and SDKs: [https://docs.bithuman.ai/concepts/agent-lifecycle](https://docs.bithuman.ai/concepts/agent-lifecycle)."
  - name: sdk-python
    x-displayName: Python SDK
    description: "`pip install bithuman` — open an avatar, render audio through it, take frames: [https://docs.bithuman.ai/sdk/python](https://docs.bithuman.ai/sdk/python)."
  - name: sdk-swift
    x-displayName: Swift SDK
    description: "The SwiftPM package for iPhone, iPad and Mac: [https://docs.bithuman.ai/sdk/ios](https://docs.bithuman.ai/sdk/ios)."
  - name: cli
    x-displayName: CLI (bithuman)
    description: "One binary for macOS Apple Silicon and Linux x86_64 — a live avatar in the browser or an MP4 render: [https://docs.bithuman.ai/sdk/cli](https://docs.bithuman.ai/sdk/cli)."
  - name: local-mode
    x-displayName: Local mode (on-device brain)
    description: "Swap the cloud conversation brain for an on-device one: [https://docs.bithuman.ai/sdk/cli/local-mode](https://docs.bithuman.ai/sdk/cli/local-mode)."
  - name: building-avatars
    x-displayName: Building avatars
    description: "Get a pre-built avatar or generate one from a portrait: [https://docs.bithuman.ai/guides/building-avatars](https://docs.bithuman.ai/guides/building-avatars)."
  - name: deploy-livekit
    x-displayName: Managed (LiveKit plugin)
    description: "Drop an avatar into a LiveKit agent worker with the plugin: [https://docs.bithuman.ai/guides/deploy-livekit](https://docs.bithuman.ai/guides/deploy-livekit)."
  - name: deploy-self-hosted
    x-displayName: Self-hosted GPU (Docker)
    description: "Run Expression 1 on your own NVIDIA hardware with the published image: [https://docs.bithuman.ai/guides/deploy-self-hosted](https://docs.bithuman.ai/guides/deploy-self-hosted)."
  - name: deploy-embed
    x-displayName: Browser embed
    description: "A talking avatar on any website with one iframe and an embed token: [https://docs.bithuman.ai/guides/deploy-embed](https://docs.bithuman.ai/guides/deploy-embed)."
  - name: community
    x-displayName: Community
    description: "Where to find bitHuman online, get help and contribute: [https://docs.bithuman.ai/community](https://docs.bithuman.ai/community)."
  - name: changelog
    x-displayName: Changelog & releases
    description: "Release notes and version history: [https://docs.bithuman.ai/changelog](https://docs.bithuman.ai/changelog)."
  - name: support
    x-displayName: Support & status
    description: "Help, Discord and the status page: [https://docs.bithuman.ai/community](https://docs.bithuman.ai/community)."
  - name: Authentication
    description: Verify API credentials with `POST /v1/validate`.
  - name: Voice
    description: |
      Text-to-speech synthesis in 30+ languages with 10 built-in
      voices, plus an OpenAI-compatible drop-in (`/v1/audio/speech`)
      and a voice-tuning preview surface.

      **Try it live:** [www.bithuman.ai/voice](https://www.bithuman.ai/voice).
  - name: Agent Generation
    description: Create new avatar agents from prompts, portraits, and voice samples.
  - name: Agent Management
    description: Retrieve and update existing agents.
  - name: Agent Context
    description: Control live avatar sessions — make them speak or inject knowledge.
  - name: Files
    description: Upload images, videos, audio, and documents.
  - name: Billing
    description: Check credit balance, plan details, and usage history.
  - name: Account
    description: Identity, plan, credits, and pricing.
  - name: Self-hosting
    description: |
      The three routes a self-hosted or on-device runtime calls: fetch the
      per-agent bundle it serves, check that its key is still live, and report
      the wall-clock it served. Self-hosted sessions are billed per minute —
      see [Pricing](#tag/pricing).
  - name: Status
    description: |
      Is the API currently refusing work? Unauthenticated, always HTTP 200 —
      read the `status` field. For a fleet-wide view use
      [status.bithuman.ai](https://status.bithuman.ai).
  - name: Webhooks
    description: |
      Register HTTPS endpoints to receive signed event notifications when
      async work finishes (today: `agent.ready`, `agent.failed`). Each
      delivery carries an `X-BitHuman-Signature: sha256=<hmac>` header — verify
      it with the secret returned once at creation.
  - name: Embedding
    description: Mint short-lived tokens for website avatar embeds.
  - name: Video
    description: |
      Render a finished talking-video mp4 from text or audio. Submit
      [`POST /v1/video/generate`](#operation/generateTalkingVideo) — async by
      default, or `wait: true` for a blocking render — and poll
      [`GET /v1/video/{job_id}`](#operation/getTalkingVideo).
  - name: Dynamics
    description: |
      Generate and manage conversational gesture animations (wave,
      nod, laugh, idle motions) for an avatar. Generate them
      asynchronously, then toggle on/off to make them the active model
      for live sessions. Gestures trigger based on keyword mapping
      during conversation.
