  /v1/models/showcase:
    get:
      operationId: getShowcaseManifest
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            # No credential, no account. Every entry is downloadable by anyone.
            curl -s https://api.bithuman.ai/v1/models/showcase | jq '.models[] | {slug, model, size}'
        - lang: shell
          label: bitHuman CLI
          source: |
            bithuman list --manifest https://api.bithuman.ai/v1/models/showcase
            bithuman pull bolt --manifest https://api.bithuman.ai/v1/models/showcase
            bithuman run ~/.cache/bithuman/showcase/bolt.imx --audio hello.wav --output out.mp4
      summary: List the freely downloadable showcase models
      description: |
        The catalogue of **Essence 2** and **Expression 2** showcase identities
        whose model weights anyone may download — no api-secret, no account.

        Each entry's `url` is
        [`GET /v1/agent/{code}/model/download`](#tag/Agent-Management/operation/downloadAgentModel),
        which answers a **302** to a 1-hour signed URL for anonymous callers
        too. The grant is still recorded (one usage row) and costs the agent's
        owner **0 credits** — an anonymous download is free or refused, never
        billed to the owner.

        The list is generated from the download route's own admission
        predicate, so a code listed here is a code the route serves: an
        `essence-2` or `expression-2` identity that is ready, listed in the
        agent gallery, owns its own artifact, and whose owner has authorised
        anonymous distribution of the weights. Agents that are merely public in
        the gallery are **not** here — being viewable is a different permission
        from the weights being distributable.

        The shape is the bitHuman CLI's manifest v2, so the shipped CLI
        consumes it directly with `--manifest`.

        **Performance, honestly.** `expression-2` clears realtime on a
        developer CPU. `essence-2` renders at roughly **1.1 fps on CPU**
        (about 22x below realtime) and wants a GPU for anything interactive —
        `note_performance` in the reply says the same.

        `sha256` is deliberately empty: no content digest is recorded for these
        objects yet, and the CLI skips verification on an empty value rather
        than failing. Verify `size` and the file itself (`bithuman info`)
        instead.

        Throttled per IP; the reply is cached for 60 seconds.
      tags: [Agent Management]
      security: []
      responses:
        "200":
          description: The showcase catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    example: 2
                  updated:
                    type: string
                    example: "2026-09-10"
                  source:
                    type: string
                  selection_criteria:
                    type: string
                  note_performance:
                    type: object
                    additionalProperties:
                      type: string
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          example: "bolt"
                        name:
                          type: string
                          example: "Bolt"
                        description:
                          type: string
                        model:
                          type: string
                          enum: [essence-2, expression-2]
                        agent_code:
                          type: string
                          example: "X03BOLT"
                        category:
                          type: string
                        is_featured:
                          type: boolean
                        url:
                          type: string
                          example: "https://api.bithuman.ai/v1/agent/X03BOLT/model/download?model=expression-2"
                        sha256:
                          type: string
                          description: Empty — no digest is published for these objects yet.
                        size:
                          type: integer
                          example: 198106157
                        votes:
                          type: integer
        "429":
          description: Too many requests from this address.

  /v1/pricing:
    get:
      operationId: getPricing
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v1/pricing \
              -H "api-secret: $BITHUMAN_API_SECRET"
      summary: Get credit pricing
      description: >-
        Machine-readable credit pricing for billable operations, so you can
        estimate cost before a call. Authoritative charges are always enforced
        server-side at request time. For forward per-minute realtime estimates
        based on your current balance, see `GET /v2/credit-summaries`
        (`minutes_estimate`).
      tags: [Account]
      responses:
        "200":
          description: Pricing retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      unit:
                        type: string
                        example: "credits"
                      agent_generation:
                        type: object
                        description: >-
                          Agent creation is priced **per model** — read
                          `by_model` (there is no flat rate). `expression-2`
                          costs 2000 credits; the Essence 2 family costs 500
                          (`essence-2` is the combined Essence 2 creation —
                          one 500-credit charge covers both models); the v1
                          families cost 250. `auto` charges the routed
                          model's rate (500 for `essence-2`, 2000 for
                          `expression-2`). Post-generation adds via
                          `POST /v1/agent/{code}/models` charge the same
                          per-model rates (adding `expression-1` is free).
                        properties:
                          unit:
                            type: string
                            example: "credits"
                          by_model:
                            type: object
                            additionalProperties:
                              type: integer
                            description: >-
                              One-time creation cost per canonical `model`
                              value accepted by `POST /v1/agent/generate`.
                              The pre-rename `essence-2-quality` spelling was
                              removed on 2026-07-29 — sending it now returns
                              a `400`.
                            example:
                              essence-1: 250
                              expression-1: 250
                              expression-2: 2000
                              essence-2: 500
                              auto: 2000
                          note:
                            type: string
                      talking_video:
                        type: object
                        properties:
                          unit:
                            type: string
                            example: "credits_per_minute"
                          billing:
                            type: string
                            example: "ceil(minutes) * rate, minimum 1 minute"
                          rates:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              essence-1: 2
                              expression-1: 4
                              expression-2: 4
                              essence-2: 4
                      dynamics_generation:
                        type: object
                        properties:
                          flat:
                            type: integer
                            example: 250
                          note:
                            type: string
                      notes:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v2/credit-summaries:
    get:
      operationId: getCreditSummaries
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v2/credit-summaries \
              -H "api-secret: $BITHUMAN_API_SECRET"
      summary: Check credit balance
      description: |
        Returns the current credit balance, plan details, and estimated minutes
        remaining for each usage type. Always scoped to the **authenticated
        account** (the owner of the `api-secret`) — there is no way to look up
        another user.
      tags: [Billing]
      security:
        - apiSecret: []
      parameters:
        - name: app
          in: query
          required: false
          description: App identifier for multi-app subscription support.
          schema:
            type: string
            default: imaginex
        - name: app_key
          in: query
          required: false
          description: Explicit subscription key for collection-scoped apps. Defaults to the same value as `app`.
          schema:
            type: string
      responses:
        "200":
          description: Credit balance retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                        description: The authenticated account's UUID.
                      balance:
                        type: number
                        format: float
                        description: Sum of plan + topup + reward credits, returned as a float (e.g. 5910592.0).
                        example: 5910592.0
                      plan_credits:
                        type: number
                        format: float
                      topup_credits:
                        type: number
                        format: float
                      minutes_estimate:
                        type: object
                        description: >-
                          Advisory forward runway: balance divided by each
                          serving mode's credits/min rate. One key per model and
                          hosting mode (essence_2_cloud, essence_2_self_hosted,
                          expression_2_cloud, expression_2_self_hosted,
                          essence_1_cloud, essence_1_self_hosted,
                          expression_1_cloud, expression_1_self_hosted), plus
                          voice_chat and camera_chat for managed agents. The
                          unversioned essence_* / expression_* keys are retained
                          aliases for the FIRST-generation models - they are NOT
                          the Essence 2 rate.
                        additionalProperties:
                          type: integer
                      is_enterprise:
                        type: boolean
                      isEnterprisePlanUser:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/embed-tokens/request:
    post:
      operationId: requestEmbedToken
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/embed-tokens/request \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"agent_id": "A78WKV4515", "fingerprint": "9f3c8b1a2d4e5f6789ab"}'
            # → data.token is a 1-hour JWT for the embed widget
      summary: Generate embed token
      description: Generate a JWT token for embedding an avatar on a website. Use this from your backend — never expose your API secret in frontend code.
      tags: [Embedding]
      security:
        - apiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_id
                - fingerprint
              properties:
                agent_id:
                  type: string
                  description: Agent code (e.g. A78WKV4515)
                  example: "A78WKV4515"
                fingerprint:
                  type: string
                  description: Stable per-device hex string used for session tracking and per-visitor rate limiting. Required.
                  example: "9f3c8b1a2d4e5f6789ab"
                model:
                  type: string
                  description: >-
                    Optional. Request a specific avatar model for the embed
                    session — a model name (`essence-1`, `expression-1`,
                    `essence-2`, `expression-2`) or a
                    force-tier slug that pins one serving tier
                    (`expression-2-gpu/-cpu/-apple`, `essence-2-gpu/-apple/-cpu`; the older
                    `-ane` spelling of the Apple tier stays accepted;
                    the legacy `essence-2-light-gpu/-cpu` slugs still pin
                    their tiers, and retired `essence-2-light(-ane)` values
                    route to the `essence-2` chain). This is the **early
                    artifact gate**: if the requested model folds onto the
                    `expression-2` / `essence-2` families and the
                    agent's trained per-identity model hasn't been generated
                    yet, the request is rejected `409 MODEL_NOT_GENERATED`
                    instead of failing later at session dispatch. Unknown
                    values return `400 VALIDATION_ERROR` listing the accepted
                    names. Omitted → the agent's own default model.
                  example: "expression-2"
      responses:
        "200":
          description: Token generated. The returned `token` is a JWT (HS256-signed) with a 1-hour TTL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  status_code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: 1-hour JWT to pass as the `data-token` attribute on the embed widget script tag.
                      sid:
                        type: string
                        description: Session identifier for tracking this embed instance.
                      model:
                        type: string
                        description: The model baked into the token claim (present when `model` was requested).
                      supported_models:
                        type: array
                        items: { type: string }
                        description: >-
                          Canonical model families this agent can be launched
                          as right now (e.g. a ready expression-2 agent lists
                          `expression-2`). Tier slugs inherit their family
                          and are not listed.
                        example: ["essence-2", "expression-2"]
        "400":
          description: >-
            `MISSING_PARAM` — the body left out `agent_id` or `fingerprint`;
            both are required and neither has a default.
            `VALIDATION_ERROR` — the `model` field names something that is not
            an accepted model; the message lists the names that are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing_fingerprint:
                  summary: No fingerprint
                  value:
                    error:
                      code: "MISSING_PARAM"
                      message: "Missing fingerprint parameter"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
                missing_agent_id:
                  summary: No agent_id
                  value:
                    error:
                      code: "MISSING_PARAM"
                      message: "Missing agent_id parameter"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
                unknown_model:
                  summary: A model name that does not exist
                  value:
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Invalid model 'essence-3'; must be one of: essence-1, expression-1, essence-2, expression-2 (legacy names and tier slugs are still accepted)"
                      httpStatus: 400
                    status: "error"
                    status_code: 400
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            `NOT_FOUND` — no agent matches `agent_id` under this API secret.
            A **deleted** agent answers this too, so a delete takes the agent
            out of the embed path immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "NOT_FOUND"
                  message: "Agent not found for code: A91XMB7113"
                  httpStatus: 404
                status: "error"
                status_code: 404
        "409":
          description: >-
            `MODEL_NOT_GENERATED` — the requested `model` folds to a known
            family the agent can't be launched as right now (it is missing
            from the agent's `supported_models`). For the trained families
            (`expression-2` / `essence-2`) the message is `agent
            <code>'s <model> model hasn't been generated yet`. Add the
            model (`POST /v1/agent/{code}/models`) or create the agent with
            it, then retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_NOT_GENERATED"
                  message: "agent A56ZFX6217's expression-2 model hasn't been generated yet"
                  httpStatus: 409
                status: "error"
                status_code: 409

  /v1/runtime-tokens/mint:
    post:
      operationId: mintScopedRuntimeToken
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/runtime-tokens/mint \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"agent_code": "A78WKV4515"}'
            # → {"scoped_token": "...", "user_id": "...", "agent_code": "A78WKV4515", "expires_at": 1757280000}
      summary: Mint a scoped runtime token for one agent
      description: |
        Exchange your API secret, **server-side**, for a 1-hour token bound to a
        single `agent_code` — so a browser, a phone app or any other client you
        do not fully control never holds your master secret.

        This is the credential the on-device paths accept. It works as
        `Authorization: Bearer <scoped_token>` on
        [the model download route](#operation/downloadAgentModel), including
        the `?member=` fetch the browser and Android runtimes use.

        The scope is real: presenting the token for a **different** agent code
        answers `404`, exactly like a code you do not own. It expires in one
        hour and is not refreshable — mint another.

        Call this from your server. Never ship the api-secret this endpoint
        consumes to a client.
      tags: [Authentication]
      security:
        - apiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_code]
              properties:
                agent_code:
                  type: string
                  example: "A78WKV4515"
                  description: The one agent this token may act for.
      responses:
        "200":
          description: A scoped token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scoped_token: { type: string }
                  user_id: { type: string }
                  agent_code: { type: string, example: "A78WKV4515" }
                  expires_at:
                    type: integer
                    description: Unix seconds; one hour from minting.
        "400":
          description: "`agent_code` is required."
        "401":
          description: Missing or invalid api-secret.

  /v1/runtime-tokens/request:
    post:
      operationId: requestRuntimeToken
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/runtime-tokens/request \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"agent_code": "A78WKV4515"}'
            # → data.token is a short-lived runtime JWT the SDK uses to run a session
      summary: Request a runtime token
      description: >-
        Exchange your API secret for a short-lived runtime token that authorizes one
        avatar session. The SDKs call this for you; call it directly when building a
        custom runtime. This is a billing endpoint — it meters credits for the session's
        model per the schedule in `GET /v1/pricing`.


        **`fingerprint` must be at least 32 characters** when you send it.
        A shorter one is rejected `400 VALIDATION_ERROR` — a common surprise
        when a custom runtime passes a short device id. It is optional: leave
        it out rather than send a short one.
      tags: [Authentication]
      security:
        - apiSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_code:
                  type: string
                  description: Agent code the session runs (attribution + transcript).
                  example: "A78WKV4515"
                billing_type:
                  type: string
                  description: Selects the model and pricing schedule for the session.
                  example: "agent-voice-chat"
                room_name:
                  type: string
                  description: LiveKit room name to associate the session with its transcript.
                user_id:
                  type: string
                  description: Optional. Attribute billing to a specific end-user (owner override).
                fingerprint:
                  type: string
                  minLength: 32
                  description: >-
                    Optional runtime-instance fingerprint (analytics only).
                    When present it must be **at least 32 characters** —
                    a shorter value is rejected `400 VALIDATION_ERROR`
                    ("String should have at least 32 characters"), so omit the
                    field rather than send a short device id.
                  example: "9f3c8b1a2d4e5f6789ab0c1d2e3f40516273849a"
      responses:
        "200":
          description: A runtime token. `data.token` is a short-lived JWT for one session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string }
                      transaction_id: { type: string }
                  status: { type: string, example: success }
                  status_code: { type: integer, example: 200 }
              example:
                data:
                  transaction_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                status: success
                status_code: 200
        "400":
          description: >-
            `VALIDATION_ERROR` — a field failed validation. The most common
            cause is a `fingerprint` shorter than 32 characters; the message
            names the field and the rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Validation failed: fingerprint: String should have at least 32 characters"
                  httpStatus: 400
                status: "error"
                status_code: 400
        "402":
          description: Insufficient credit balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "INSUFFICIENT_BALANCE"
                  message: "Not enough credits to start a session"
                  httpStatus: 402
                status: "error"
                status_code: 402
        "403":
          description: Key revoked, account suspended, or concurrency limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/realtime/ephemeral-token:
    post:
      operationId: requestRealtimeToken
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/realtime/ephemeral-token \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" -d '{}'
            # → data.value is an OpenAI client secret; hand it to the browser
      summary: Mint a realtime client secret
      description: >-
        Mint a short-lived OpenAI-Realtime client secret so a browser can open a realtime
        voice session without your API secret. Mint on the server and pass only `data.value`
        to the client. Balance-gated; rate-limited to 20/min. Realtime voice is metered at
        10 credits/min once the session runs.
      tags: [Voice]
      security:
        - apiSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: OpenAI Realtime model. Defaults to the current bitHuman default.
                  example: "gpt-realtime-mini"
      responses:
        "200":
          description: A client secret. Mint one per session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      value: { type: string }
                      expires_at: { type: integer }
                      model: { type: string }
                  status: { type: string, example: success }
                  status_code: { type: integer, example: 200 }
              example:
                data:
                  value: "ek_68f0c2..."
                  expires_at: 1751500000
                  model: "gpt-realtime-mini"
                status: success
                status_code: 200
        "402":
          description: Out of credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many realtime sessions; slow down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/dynamics/generate:
    post:
      operationId: generateDynamics
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/dynamics/generate \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"agent_id": "A91XMB7113"}'
            # → {"success": true, "status": "processing"} — poll GET /v1/dynamics/A91XMB7113
      summary: Generate gesture animations
      description: |
        Create gesture animations (wave, nod, smile, laugh, etc.) for an agent.
        These can be triggered during live sessions via keyword mapping.
      tags: [Dynamics]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional. A unique client-generated key (e.g. a UUID). Retrying with the same key returns the original response instead of starting a second billed job. Keys are retained for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  example: "A91XMB7113"
                image_url:
                  type: string
                  description: Source image URL. Optional — defaults to the agent's primary image if omitted.
                duration:
                  type: integer
                  default: 5
                  description: Gesture duration in seconds.
                model:
                  type: string
                  enum: [seedance, auto]
                  default: seedance
                  description: >-
                    Video motion model. `seedance` (Seedance 1.5 pro) is the only
                    dynamics model; `auto` resolves to it. Any legacy value (e.g.
                    the retired `kling`) is coerced to `seedance`.
      responses:
        "200":
          description: Dynamics generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Dynamics generation started"
                  agent_id:
                    type: string
                  status:
                    type: string
                    example: "processing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient credits. Dynamics generation costs 250 credits — INSUFFICIENT_BALANCE.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/dynamics/{agent_id}:
    get:
      operationId: getDynamics
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v1/dynamics/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET"
      summary: Get available gestures
      description: List all available gesture animations for an agent.
      tags: [Dynamics]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
          example: "A91XMB7113"
      responses:
        "200":
          description: Available gestures
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      agent_id:
                        type: string
                      url:
                        type: string
                        description: Model path or null.
                      status:
                        type: string
                        enum: [ready, generating, processing, failed]
                      gestures:
                        type: object
                        description: Map of gesture name to video URL.
                        additionalProperties:
                          type: string
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateDynamics
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X PUT https://api.bithuman.ai/v1/dynamics/A91XMB7113 \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"dynamics": {"enabled": true}, "toggle_enabled": true}'
      summary: Update dynamics configuration
      description: |
        Update gesture settings for an agent. After a successful update,
        movements regeneration is automatically triggered in the background.
      tags: [Dynamics]
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dynamics]
              properties:
                dynamics:
                  type: object
                  description: |
                    Dynamics configuration to merge with existing data.
                    Fields: `enabled` (boolean), `batch_results` (gesture results),
                    `result` (model path/hash when generated), `talking` (default model path/hash).
                  properties:
                    enabled:
                      type: boolean
                      description: Enable or disable dynamics for this agent.
                    batch_results:
                      type: object
                      description: Map of gesture names to video generation results.
                    result:
                      type: object
                      description: Result model path and hash (set when dynamics generation completes).
                    talking:
                      type: object
                      description: Default talking model path and hash (used when dynamics are disabled).
                toggle_enabled:
                  type: boolean
                  description: |
                    `true` to switch agent to dynamics model, `false` to restore default talking model.
      responses:
        "200":
          description: Dynamics updated and movements regeneration triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Dynamics updated successfully and movements regeneration started"
                  agent_id:
                    type: string
                  regeneration_status:
                    type: string
                    enum: [started, failed]
                    description: Whether background movements regeneration was triggered.
                  regeneration_error:
                    type: string
                    description: Error message if regeneration_status is "failed".

  /v1/video/generate:
    post:
      operationId: generateTalkingVideo
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/video/generate \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{
                "model": "essence-2",
                "agent_code": "A91XMB7113",
                "input": {"type": "text", "text": "Hello, welcome to bitHuman."}
              }'
            # → {"success": true, "job_id": "vid_3f9a2c1b8e7d4a6f0b21", "status": "processing"}
            # add "wait": true to block (≤ ~90 s) for the finished video_url
      summary: Generate a talking video
      description: |
        Render a talking-video (mp4) from **text** or **audio**, driven by one of
        your agents.

        **Two modes:**
        - **Async (default)** — returns immediately with a `job_id`; poll
          [`GET /v1/video/{job_id}`](#operation/getTalkingVideo) for the finished
          video. Use this for anything but the shortest clips — renders can take a
          while, so you don't want to hold the connection.
        - **Sync** — set `wait: true` (or `?wait=true`). The call blocks until the
          render finishes (up to ~90s) and returns the `video_url` directly in this
          response. If the render is still running at that cap you get the async
          response (`status: processing`) instead — just poll the `job_id`.

        - **Text input** — the agent's own voice speaks your `text` (text → speech →
          render). Pass `input.voice` to override the voice for this render.
        - **Audio input** — your `audio_url` (a hosted WAV/MP3) drives the render
          directly.

        The output is a public CDN URL. `essence-2` renders at
        **1080p** by default (1080×1920 portrait or 1920×1080 landscape, matching
        the source orientation and capped at the source's long side);
        `expression-2` renders at its native 416×720. Limits: max **120 seconds**
        of output, max **5000 characters** of text.
      tags: [Video]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Optional. A unique client-generated key (e.g. a UUID). Retrying with the same key returns the original response instead of starting a second billed job. Keys are retained for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input, agent_code]
              properties:
                model:
                  type: string
                  enum: [essence-1, expression-1, essence-2, expression-2]
                  description: |
                    Avatar engine. `essence-1` (2 credits/min) and
                    `expression-1` (4 credits/min) are the classic v1 engines,
                    available today. `expression-2` (4 credits/min) and `essence-2`
                    (4 credits/min, the standard distilled renderer — the
                    former `essence-2-light` name, which is no longer
                    accepted) are the v2 engines.
                  example: "essence-2"
                agent_code:
                  type: string
                  description: An agent you own — provides the avatar identity (and, for text input, the default voice).
                  example: "A91XMB7113"
                wait:
                  type: boolean
                  default: false
                  description: >-
                    Sync toggle. `false` (default) returns a `job_id` immediately
                    (async — poll for the result). `true` blocks until the render
                    finishes (up to ~90s) and returns the finished `video_url` in
                    this response; if it exceeds the cap you get
                    `status: processing` + a `job_id` to poll. `?wait=true` as a
                    query parameter also works.
                input:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [text, audio]
                    text:
                      type: string
                      maxLength: 5000
                      description: Required when `type` is `text`. The script to speak.
                      example: "Hello, welcome to bitHuman."
                    voice:
                      type: string
                      description: Optional voice id override for text input. Defaults to the agent's own voice.
                    audio_url:
                      type: string
                      description: Required when `type` is `audio`. A public URL to a WAV or MP3 file.
                      example: "https://example.com/speech.wav"
      responses:
        "200":
          description: >-
            Async (or sync-timed-out): `status: processing` + a `job_id` to poll.
            Sync completed: `status: completed` with `video_url`, `duration_seconds`,
            and `credits_charged`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: string
                    example: "vid_3f9a2c1b8e7d4a6f0b21"
                  status:
                    type: string
                    enum: [processing, completed]
                    example: "processing"
                  video_url:
                    type: string
                    description: Public mp4 URL — present only on a completed sync render (wait=true).
                  duration_seconds:
                    type: number
                    format: float
                    description: Output duration — present on a completed sync render.
                  credits_charged:
                    type: integer
                    description: Credits charged — present on a completed sync render.
        "400":
          description: Validation error — invalid model, missing input, or text/audio missing.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient credits — INSUFFICIENT_BALANCE. The cost is `ceil(minutes) × rate` (essence-1 = 2, expression-1 = 4, expression-2 = 4, essence-2 = 4 credits/min).
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `MODEL_NOT_GENERATED` — checked **before any charge**: the
            requested `model` is a family this agent can't be rendered as
            right now. For `expression-2` / `essence-2` that means the trained
            per-identity model hasn't been generated yet (message: `agent
            <code>'s <family> model hasn't been generated yet`, spelled with
            the public family name); `essence-1` needs the agent's `.imx` model file
            (present on every completed essence-1 creation) and
            `expression-1` needs an expression-1 agent (or the free
            post-generation expression-1 model add) with an image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_NOT_GENERATED"
                  message: "agent A56ZFX6217's essence-2 model hasn't been generated yet"
                  httpStatus: 409
                status: "error"
                status_code: 409
        "503":
          description: >-
            `MODEL_NOT_YET_AVAILABLE` — the requested model can't render
            right now (no routeable worker, or the model is temporarily
            paused). All four avatar models render talking video in normal
            operation, so this is a rare, transient condition. Returned
            **before any charge** — retry shortly, or render with another
            of the agent's supported models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: "MODEL_NOT_YET_AVAILABLE"
                  message: "essence-2 talking video isn't available right now — retry shortly"
                  httpStatus: 503
                status: "error"
                status_code: 503
        "504":
          $ref: "#/components/responses/EdgeGatewayTimeout"

  /v1/video/{job_id}:
    get:
      operationId: getTalkingVideo
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl https://api.bithuman.ai/v1/video/vid_3f9a2c1b8e7d4a6f0b21 \
              -H "api-secret: $BITHUMAN_API_SECRET"
            # poll until status is "completed" — then video_url is the public mp4
      summary: Get talking-video status
      description: |
        Poll a talking-video render job. While rendering, `status` is `processing`.
        When done, `status` is `completed` and the response carries `video_url`,
        `duration_seconds`, and `credits_charged`. On failure, `status` is `failed`
        and the up-front charge is automatically refunded.
      tags: [Video]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          example: "vid_3f9a2c1b8e7d4a6f0b21"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job_id:
                    type: string
                  status:
                    type: string
                    enum: [processing, completed, failed]
                  model:
                    type: string
                  video_url:
                    type: string
                    description: Public mp4 URL (present when status is `completed`).
                  duration_seconds:
                    type: number
                    format: float
                    description: Output duration in seconds (present when `completed`).
                  credits_charged:
                    type: integer
                    description: Credits charged for this render (present when `completed`).
                  error:
                    type: object
                    description: Failure detail (present when status is `failed`).
                    properties:
                      message:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tts:
    post:
      operationId: synthesizeSpeech
      x-codeSamples:
        - lang: shell
          label: cURL
          source: |
            curl -X POST https://api.bithuman.ai/v1/tts \
              -H "api-secret: $BITHUMAN_API_SECRET" \
              -H "content-type: application/json" \
              -d '{"text": "Hello from bitHuman.", "voice": "F1"}' \
              --output hello.wav
      summary: Synthesize speech from text
      description: |
        Generates audio (WAV or PCM) from a text prompt. Pick a built-in voice
        (`M1`-`F5`), tune it inline with `axes`, or pass a `voice_code` from the
        [Voice Designer](https://www.bithuman.ai/voice). Supports 30+ languages,
        per-request quality / speed tuning, and optional sentence-by-sentence
        streaming. An unknown `voice_code` returns `404 VOICE_NOT_FOUND`.
      tags: [Voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Text to synthesize (any length; multi-sentence supported).
                  example: "Hello from bitHuman."
                voice:
                  type: string
                  description: Voice ID. Built-in voices are `M1`-`M5` (male) and `F1`-`F5` (female). List them with `GET /v1/voices`.
                  default: "M1"
                  example: "F1"
                voice_code:
                  type: string
                  description: |
                    A designed-voice handle from the [Voice Designer](https://www.bithuman.ai/voice).
                    Expands server-side to a base voice + tuning, so you don't send `voice` / `axes`
                    yourself. A UUID references a saved voice; a `bv1_…` code self-encodes the config.
                    Takes precedence over `voice` when present.
                  example: "f8fb5feb-8a19-435c-89e5-a286a03565ec"
                axes:
                  type: object
                  description: |
                    Inline voice tuning — the same semantic axes as `GET /v1/studio/axes`
                    (`gender`, `pitch`, `rate`, `brightness`). Offsets are small (roughly −0.3…0.3);
                    `0` is neutral. Ignored when `voice_code` is supplied.
                  additionalProperties:
                    type: number
                  example:
                    gender: 0.1
                    pitch: 0.05
                    rate: -0.1
                    brightness: 0.2
                language:
                  type: string
                  description: ISO-2 language code. 30+ languages supported (the advertised count and the live server list don't always match exactly).
                  default: "en"
                  example: "en"
                total_steps:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 8
                  description: Denoise step count. `5`=fast/lower quality, `8`=balanced, `12`=highest.
                speed:
                  type: number
                  minimum: 0.7
                  maximum: 2.0
                  default: 1.05
                  description: Playback rate.
                format:
                  type: string
                  enum: [wav, pcm_s16le]
                  default: wav
                  description: Response audio format.
                stream:
                  type: boolean
                  default: false
                  description: If true, returns sentence-chunked length-prefixed PCM frames.
      responses:
        "200":
          description: Audio bytes (WAV or PCM, per request `format`).
          content:
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`voice_code` did not resolve to a known voice (`VOICE_NOT_FOUND`)."
        "503":
          description: Queue full / service overloaded. Retry with backoff.

  /v1/voices:
