name: Credential claims re-measured

# A CREDENTIAL OR BILLING CLAIM DESCRIBES BYTES. WHEN THE BYTES MOVE, SOMEONE
# HAS TO LOOK AGAIN.
#
# Measured 2026-09-14: the pricing page said BITHUMAN_UNMETERED=1 renders free
# in the Python SDK. The published wheel refuses a credential-less render with
# and without it. That claim was live for weeks, across several releases, and
# nothing re-read the artifact.
#
# ★The asymmetry this corrects: how carefully a claim gets checked scales with
# how BIG it looks, not with what it costs if it is wrong. "Our quickstart does
# not compile" is big and gets driven against three artifacts. "The Python SDK
# honours this variable" is one clause in a table, and it rode for weeks — and
# it was the one that could tell a developer they were not being billed when
# they were. Size is visible; cost is not.
#
# WHEN IT RUNS. On any change to a page carrying a registered claim or to the
# manifest; and DAILY, because the event that invalidates a claim is a RELEASE
# PUBLISHING, which is not an event in this repository. This is the re-read,
# not the measurement: it goes red the morning after a press and stays red
# until someone re-drives the arm on the customer path.
#
# EXIT 0 every claim was driven against the newest bytes · 1 one was not · 2
# CANNOT CHECK, a failure you can see and never a pass.

on:
  push:
    branches: [main]
    paths:
      - src/content/docs/guides/pricing.md
      - src/content/docs/sdk/cli.md
      - src/content/docs/sdk/cli/reference.md
      - src/content/docs/changelog.md
      - scripts/credential-claims.json
      - scripts/check-credential-claims-remeasured.mjs
      - .github/workflows/credential-claims.yml
  pull_request:
    paths:
      - src/content/docs/guides/pricing.md
      - src/content/docs/sdk/cli.md
      - src/content/docs/sdk/cli/reference.md
      - src/content/docs/changelog.md
      - scripts/credential-claims.json
      - scripts/check-credential-claims-remeasured.mjs
      - .github/workflows/credential-claims.yml
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-claims:
    name: every credential claim was driven against the newest bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Fixtures, no network: both red controls fire on every run, so the
      # instrument is graded even when the network is what broke.
      - name: The claims gate proves itself
        run: node scripts/check-credential-claims-remeasured.mjs --selftest

      - name: Every registered claim matches the newest published artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-credential-claims-remeasured.mjs
