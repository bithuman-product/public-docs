name: Internal links

# Docs correctness checks that nothing else resolves.
#
# 1. Internal links — the round-2 docs audit found several dead ones
#    (e.g. /sdk/kotlin when the page is /sdk/android, /concepts/pricing when
#    it's /guides/pricing, /api/voice when it's /api/text-to-speech). They rot
#    silently because nothing resolves them. scripts/check-internal-links.mjs
#    collects every valid route (content collection + explicit pages) and fails
#    if any markdown link to an internal /route doesn't resolve.
#
# 2. Billing consistency — the worked `minutes_estimate` JSON examples are the
#    numbers a customer reads to decide whether they can afford a session, and
#    they are hand-maintained alongside a rate table that changes independently.
#    The 2026-07-28 audit found both examples documenting 4 serving keys when
#    the API returns 16, and the 4 they did document were the unversioned
#    aliases that mean the FIRST-generation rate — a 2x/4x over-estimate for
#    anyone running Essence 2. scripts/check-billing-consistency.mjs re-derives
#    every documented estimate from the pricing table and fails on disagreement.
#
# 3. Model-enum examples — the `model` enums in src/openapi/bithuman.yaml are
#    hand-maintained HERE, in a different repo from the API that enforces them,
#    and they have drifted from the code's accepted sets three times. The third,
#    on 2026-07-29, was customer-visible and fixed by hand: the spec's examples
#    and cURL samples advertised `essence-2-quality` after
#    POST /v1/video/generate had begun 400-rejecting it, so a caller copying our
#    example got an error. scripts/check-model-enum-examples.mjs fails if any
#    documented `model` value (schema `example:`, a `"model": "..."` in a code
#    sample, a `?model=` in a sample URL) is not a member of that endpoint's own
#    enum.
#
#    ★WHAT THIS HALF CANNOT SEE, and where the other half lives. Whether the
#    ENUM matches the API's accepted set needs both repos in one checkout, and
#    the API is in a PRIVATE repo this public one holds no token for (adding one
#    would mean a new secret). That comparison therefore runs on the platform
#    side — the `model-enum-drift` job of its .github/workflows/audit-tests.yml,
#    which checks THIS repo out (public, so no secret) and diffs each enum
#    against the shipped VALID_AGENT_MODELS / SUPPORTED_VIDEO_MODELS /
#    ALLOWED_DYNAMICS_MODELS / _ADDABLE_MODELS. Its limitation is the mirror of
#    ours: it reads this repo's `main`, so a docs-only drift lands red on the
#    next platform push rather than on the docs PR that caused it. Neither half
#    is sufficient — that job compares enums and never reads an example; this
#    step reads every example and never sees the code.
#
#
#    ★Its corpus was widened on 2026-09-02 to the site chrome (src/components,
#    src/layouts, src/config, src/data, src/styles), README.md and vercel.json.
#    It had scanned only src/content, src/pages, src/openapi, public/api and
#    STYLE.md, so a retired name in a nav label or a layout — rendered on EVERY
#    page — was invisible: appending "Essence 2 Light is the cheap tier; pick
#    embody for mobile." to src/components/Nav.astro left it green. It fails on
#    that now, and refuses to pass if any root it lists stops contributing files
#    (which is how the corpus would silently shrink back).
#
# 4. Retired product names — the 2026-09-02 owner ruling is that a developer
#    reading this site meets only essence-2 and expression-2. `elevate`,
#    `embody`, `essence-2-light`, `essence-2-quality` and `lebundle` are
#    DEPRECATED. ★Deprecate is not rename: the strings a developer must TYPE —
#    the `.lebundle.imx` file the download endpoint hands them, the
#    `libelevate-web` artifact path, the tier slugs saved links carry, the
#    /concepts/ redirects — are FROZEN and must keep working forever, spelled
#    exactly, with a plain note that they are legacy names kept for
#    compatibility. scripts/check-retired-model-names.mjs fails only on a
#    retired name used as a LIVE product name, and separately asserts the two
#    retired /concepts/ URLs still redirect to a real page. It refuses to pass
#    vacuously: if a frozen carrier stops appearing in the corpus at all, that
#    is a rename and it exits non-zero.
# 5. Unresolved placeholders — the three withdrawn performance numbers on this
#    site (2026-07-28, 2026-08-26, 2026-09-02) were all the same mistake: a
#    figure measured on one thing, printed as if it described another. The
#    defence that works is to write the page while the measurement is still
#    missing, leave a `TKTK` marker where the number goes, and make CI red until
#    someone replaces it. scripts/check-placeholders.mjs fails on any TKTK
#    marker under src/content, src/pages, src/openapi or public/api. It does NOT
#    scan drafts/, which has no route and exists precisely to hold page-sized
#    text whose subject is not yet true.
#
# Every step always runs: `if: always()` so a broken link cannot mask a billing
# or model-enum error by aborting the job first.

on:
  push:
    branches: ['**']
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'src/openapi/**'
      - 'scripts/**'
      - '.github/workflows/link-check.yml'
      # ★2026-09-02: the five globs above did not cover files these checks
      # already read, so a change to one of them could never turn the job red.
      # vercel.json is the sharp case: check-retired-model-names.mjs ASSERTS the
      # two frozen /concepts/ redirects, and deleting one is precisely the
      # unrecoverable break the assertion exists to stop — but vercel.json
      # matches none of the globs above, so that commit ran no workflow at all.
      # Measured: with the redirect deleted the checker exits 1; on a
      # vercel.json-only push nothing invoked it. The rest are the site chrome
      # and data now inside the checker's corpus, plus the STYLE.md rule text
      # and public/api (the spec customers download, which sync-openapi only
      # rewrites when src/openapi changed).
      - 'vercel.json'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/config/**'
      - 'src/data/**'
      - 'src/styles/**'
      - 'public/api/**'
      - 'STYLE.md'
      - 'README.md'
  pull_request:
    paths:
      - 'src/content/**'
      - 'src/pages/**'
      - 'src/openapi/**'
      - 'scripts/**'
      - '.github/workflows/link-check.yml'
      # ★2026-09-02: the five globs above did not cover files these checks
      # already read, so a change to one of them could never turn the job red.
      # vercel.json is the sharp case: check-retired-model-names.mjs ASSERTS the
      # two frozen /concepts/ redirects, and deleting one is precisely the
      # unrecoverable break the assertion exists to stop — but vercel.json
      # matches none of the globs above, so that commit ran no workflow at all.
      # Measured: with the redirect deleted the checker exits 1; on a
      # vercel.json-only push nothing invoked it. The rest are the site chrome
      # and data now inside the checker's corpus, plus the STYLE.md rule text
      # and public/api (the spec customers download, which sync-openapi only
      # rewrites when src/openapi changed).
      - 'vercel.json'
      - 'src/components/**'
      - 'src/layouts/**'
      - 'src/config/**'
      - 'src/data/**'
      - 'src/styles/**'
      - 'public/api/**'
      - 'STYLE.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check internal links
        run: node scripts/check-internal-links.mjs
      - name: Check billing consistency
        if: always()
        run: node scripts/check-billing-consistency.mjs
      # No documented `model` example may name a model its own endpoint's enum
      # does not list (the 2026-07-29 essence-2-quality incident). See note 3
      # above for the half of the drift this cannot see and where that runs.
      - name: Check model-enum examples
        if: always()
        run: node scripts/check-model-enum-examples.mjs
      # public/api/openapi.yaml is the spec customers actually download from
      # /api/openapi.yaml. It is a COPY of src/openapi/bithuman.yaml, refreshed
      # only by `npm run sync-openapi` (which prebuild/predev call). Edit the
      # source without running a build and the published spec silently keeps the
      # old text — on 2026-07-28 it was still telling callers that the `success`
      # agent status is terminal, two commits after that was corrected in source.
      # A retired product name may be SPELLED (a migration note, a 400-hint, a
      # dated changelog entry, a filename a developer types) but never used as a
      # live product name. Frozen carriers are asserted present, not merely
      # allowed — renaming one breaks a client that resolves it by exact name.
      - name: Check retired product names
        if: always()
        run: node scripts/check-retired-model-names.mjs
      # A TKTK marker means a sentence on a published page is waiting on a fact
      # nobody has yet. Red until it is measured or the page moves to drafts/.
      - name: Check for unresolved placeholders
        if: always()
        run: node scripts/check-placeholders.mjs
      - name: Published OpenAPI spec is in sync with its source
        if: always()
        run: |
          npm run sync-openapi --silent
          git diff --exit-code -- public/api/openapi.yaml || {
            echo "::error file=public/api/openapi.yaml::published spec is stale — run 'npm run sync-openapi' and commit the result"
            exit 1
          }
