name: Performance table matches the floors record

# EVERY SPEED THIS SITE PUBLISHES IS GENERATED, AND THIS IS WHERE A HAND EDIT IS CAUGHT.
#
# bithuman-models' emitter (models/essence-2/tools/check_perf_floors.py) writes
# every measured number between `<!-- FLOORS:… -->` markers — the performance
# page's speed table, release line, memory table and method paragraph, the
# headline partial, the per-platform snippets — and writes public/performance.json
# beside them. scripts/check-performance-floors.mjs pins all of it; this workflow
# grades the pin on every pull request, every push to main, and daily.
#
# WHAT EACH STEP ANSWERS, and what it cannot
#   1. the gates' own controls — defect arms that must fire, good arms that must
#      stay silent, corpus controls. First, always, no network.
#   2. blocks <-> pin, table <-> performance.json, json <-> the 30-day clock. No
#      network, no credential. This is the hand-edit question and the staleness
#      question, and it is the half this repository can both answer and fix.
#   3. no measured frame rate typed outside a generated block, anywhere a page is
#      built from (scripts/check-perf-literals.mjs).
#   4. served <-> pin, on the trunk only, waiting out the deploy: a merged page is
#      not a published one.
#   5. json <-> record. ★THIS RUNNER CANNOT DO IT: bithuman-models is private and
#      this repository holds no secret, so the gate says COULD NOT LOOK rather
#      than MATCHED, and the summary says so on every run.
#
#      THE PIN IS REFRESHED BY HAND, from a bithuman-models checkout, at origin/main:
#        node scripts/check-performance-floors.mjs --regen --models <bithuman-models>
#      (--regen runs origin/main's emitter over every marked file, writes
#      public/performance.json, then pins; --write pins only if a fresh emit
#      reproduces the files byte for byte.)
#
# WHAT A RED MEANS. A generated block or performance.json was edited away from
# the emitter's output, a published cell passed the 30-day re-measure clock, or a
# page typed a measured rate by hand. Regenerate from the record. Never edit the
# record to agree with a page: a floor moves with a measurement, not a docs PR.

on:
  push:
    branches: [main]
  pull_request:
  # A row does not go stale because someone edited it. It goes stale because the
  # calendar moved, and no push event can notice that. Daily, early.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-floors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance-floors:
    name: every published figure is the one the record measured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The gates prove they can fail (defect arms fire, good arms stay silent)
        run: |
          node scripts/check-performance-floors.mjs --selftest
          node scripts/check-perf-literals.mjs --selftest

      # ★WHY THIS STEP ACCEPTS 2. The verdicts are 0 MATCHED, 1 DRIFTED, 2 COULD
      #   NOT LOOK. On this runner the record half cannot run (bithuman-models is
      #   private, no secret here), so 2 is the honest verdict; the summary step
      #   says so beside the tick. 1 is a hand edit or a cell past the clock, and
      #   fails. ★`cmd || rc=$?`, not `cmd; rc=$?`: `run:` is `bash -e`.
      - name: No generated block or performance.json edited, and no cell past the clock
        run: |
          rc=0; node scripts/check-performance-floors.mjs || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: No measured frame rate typed outside a generated block
        run: node scripts/check-perf-literals.mjs

      # ★THE TRUNK GRADES THE BYTES A CUSTOMER RECEIVES, once they are deployed.
      #   A push to main races Vercel's build, so a table that still reads the
      #   previous build is retried for up to 10 minutes before it counts; the
      #   scheduled run grades whatever is live. 2 here is the site unreachable.
      - name: docs.bithuman.ai serves the pinned table and performance.json
        if: github.event_name != 'pull_request'
        run: |
          for attempt in $(seq 1 20); do
            rc=0; node scripts/check-performance-floors.mjs --served https://docs.bithuman.ai > served.log 2>&1 || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then cat served.log; exit 0; fi
            if [ "${{ github.event_name }}" != "push" ]; then break; fi
            echo "attempt $attempt: the served site does not match the pin yet (rc=$rc); waiting for the deploy"
            sleep 30
          done
          cat served.log; exit "$rc"

      # ★THE ANTI-SILENCE ARM. It always runs, it never fails the job, and it
      #   writes down what this runner did NOT check.
      - name: Say out loud what this runner could not look at
        if: always()
        run: |
          {
            echo '## Performance numbers against the floors record'
            echo
            echo 'A green tick means NO GENERATED BLOCK and NOT performance.json has been edited away'
            echo 'from `scripts/performance-floors.json`, the speed table agrees with performance.json,'
            echo 'no published cell is past the 30-day re-measure clock, and no page types a measured'
            echo 'frame rate by hand. It does NOT mean performance.json was re-read against'
            echo '`models/essence-2/perf/FLOORS.json`: that record is in a private repository and this'
            echo 'runner holds no credential for it, so that half prints COULD NOT LOOK here. It is'
            echo 're-checked where the record lives, and by hand with `--models <checkout>`.'
            echo
            echo '```'
            node scripts/check-performance-floors.mjs 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
