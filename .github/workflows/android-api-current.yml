name: Android API reference current

# THE ANDROID API REFERENCE STILL DESCRIBES THE AARs MAVEN CENTRAL SERVES TODAY.
#
# /sdk/android-api is generated: a script resolves the newest published version
# of each Android artifact, downloads that exact .aar, verifies it against the
# .sha256 and .sha512 sidecars Central publishes beside it, and reads the public
# surface back out of the bytes — the Kotlin metadata AND the class files, and
# it records where the two disagree. Nothing on that page was typed, and
# nothing on it was read from a source tree, a -sources.jar or a -javadoc.jar.
#
# ★WHY THIS RUNS ON A SCHEDULE AND NOT ONLY ON PUSH. The page cannot go wrong on
# its own; it goes wrong when a RELEASE PUBLISHES, which is not an event in this
# repository. Everything on this site generated from a published artifact and
# then left alone has gone stale the same way. The subject of this job is Maven
# Central, so Central is what it asks, every morning.
#
# The job downloads the .aar for real and reads it with a JDK. That is the
# point: a surface read from a metadata API is a claim about the artifact, and
# this one is the artifact.
#
# EXIT 0 the reference matches the shipped surface · 1 it does not (the surface
# moved, the record is stale, or the page is not what the record renders — the
# run names which) · 2 CANNOT CHECK (Central unreachable, no JDK, the bytes do
# not match their sidecars), a failure you can see and never a pass.

on:
  push:
    branches: [main]
    paths:
      - src/content/docs/sdk/android-api.md
      - scripts/android-surface.json
      - scripts/gen-android-api.mjs
      - scripts/check-android-api-current.mjs
      - scripts/android-api-extract.java
      - .github/workflows/android-api-current.yml
  pull_request:
    paths:
      - src/content/docs/sdk/android-api.md
      - scripts/android-surface.json
      - scripts/gen-android-api.mjs
      - scripts/check-android-api-current.mjs
      - scripts/android-api-extract.java
      - .github/workflows/android-api-current.yml
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-api-current:
    name: the reference is the surface of the newest published AARs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The extractor runs in Java source-file mode against three pinned,
      # digest-verified jars. The surface it reads is identical under JDK 17
      # and JDK 25 (proved by extracting one .aar under both and diffing), so
      # the JDK here is the one the Android page tells a developer to use.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Fixtures, no network: one arm per outcome, including every kind of FAIL
      # and three ways of not being able to look. An instrument that cannot show
      # its own red is not evidence of anything.
      - name: The re-extraction gate proves itself
        run: node scripts/check-android-api-current.mjs --selftest

      - name: Re-extract the newest published AARs and compare with the page
        run: node scripts/check-android-api-current.mjs
